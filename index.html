<style>
  :root {
    --navy: #16233F;
    --navy-light: #223259;
    --navy-darker: #0E1729;
    --gold: #C79A3C;
    --gold-light: #E8C77A;
    --paper: #FAF7F1;
    --paper-2: #F1ECE1;
    --liy: #E4DCC8;
    --text-gray: #5B5A54;
    --dark: #1C1B18;
    --green: #2F6F4B;
    --red: #B33A3A;
    --app-blue: #3B82F6;
    --wa-green: #25D366;
    --fb-blue: #1877F2;
    --x-black: #0A0A0A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; touch-action: pan-y; overscroll-behavior-y: contain; scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { display: none; }
  body { font-family: 'Inter', sans-serif; background: var(--paper); overflow-x: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input, textarea, [contenteditable="true"] { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  #app { position: relative; width: 100%; min-height: 100vh; }
  .hidden { display: none !important; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Top navbar ---------- */
  .top-navbar-wrap {
    position: sticky; top: 0; z-index: 25;
    padding: 8px 6px 0;
  }
  .top-navbar {
    background: var(--navy-darker);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-radius: 18px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.3);
  }
  .top-navbar-glow {
    height: 2px;
    margin: 8px 22px 0;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-light) 20%, var(--gold-light) 80%, transparent);
    box-shadow: 0 0 8px 1.5px rgba(232,199,122,0.65);
  }
  .navbar-left { display: flex; align-items: center; gap: 10px; }
  .hamburger-btn {
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
    width: 22px; background: none; border: none; cursor: pointer; padding: 4px 0;
  }
  .hamburger-btn span { display: block; height: 2px; width: 100%; background: var(--paper); border-radius: 2px; }
  .navbar-logo { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .navbar-text { display: flex; flex-direction: column; gap: 1px; }
  .navbar-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15.5px; color: var(--paper); display: flex; align-items: center; gap: 5px; line-height: 1.15; }
  .navbar-subtitle { font-size:11.5px; font-weight: 600; letter-spacing: 0.02em; color: var(--paper); }
  .navbar-subtitle .word { color: var(--gold-light); }
  .navbar-status { display: flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.03em; color: var(--paper); margin-top: 1px; }
  .navbar-status.ceo { color: var(--paper); }
  .pulse-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; animation: pulseDot 1.6s ease-out infinite; }
  .pulse-dot.green { background: var(--green); }
  .pulse-dot.red { background: var(--red); }
  @keyframes pulseDot {
    0% { box-shadow: 0 0 0 0 rgba(0,0,0,0.4); }
    70% { box-shadow: 0 0 0 6px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }
  .navbar-right { display: flex; align-items: center; }
  .profile-btn {
    width: 34px; height: 34px; border-radius: 50%;

    display: flex; align-items: center; justify-content: center;
    color: var(--gold-light); cursor: pointer; overflow: hidden; padding: 0;
  }
  .profile-btn img { width: 100%; height: 100%; object-fit: cover; }
  .connect-btn {
    padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--gold-light);
    background: transparent; color: var(--gold-light); font-size: 12.5px; font-weight: 700;
    cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .notif-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(232,199,122,0.4);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-light); cursor: pointer;
  }
  .chat-status-dot {
    position: absolute; top: 2px; right: 2px; width: 11px; height: 11px; border-radius: 50%;
    border: 2px solid var(--paper); animation: pulseDot 1.6s ease-out infinite;

  .chat-status-dot.green { background: var(--green); }
  .chat-status-dot.red { background: var(--red); }
  .chat-status-dot.gray { background: var(--text-gray); animation: none; }

  /* ---------- Sidebar (half-screen) ---------- */
  .sidebar-overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(22,35,63,0.15);
    display: none;
  }
  .sidebar-overlay.open { display: block; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 60%;
    max-width: 320px;
    background: linear-gradient(180deg, var(--navy-darker) 0%, var(--navy) 55%, var(--navy-light) 100%);
    z-index: 61;
    transform: translateX(-100%);
    transition: transform 0.28s ease;
    padding: 34px 16px 20px;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: 4px 0 24px rgba(0,0,0,0.3);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-status { display: flex; align-items: center; gap: 6px; font-size:12px; font-weight: 700; letter-spacing: 0.03em; margin-top: 3px; }
  .sidebar-status.online { color: var(--green); }
  .sidebar-status.offline { color: var(--red); }
  .sidebar-status .pulse-dot { width: 6px; height: 6px; }
  .sidebar-close {
    position: absolute; top: 18px; right: 16px;
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: rgba(255,255,255,0.1); border: none; color: var(--paper);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    z-index: 2;
  }
  .sidebar-header-row { position: relative; padding-right: 54px; }
  .sidebar-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 10px; border-radius: 10px; border: none; background: none;
    color: var(--paper); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; text-align: left;
  }
  .sidebar-item:hover { background: rgba(255,255,255,0.06); }

  /* ---------- Home hero ---------- */
  .home { padding-bottom: 110px; }
  .home-inner { width: 100%; margin: 0 auto; }
  .home-header { background: linear-gradient(160deg, var(--navy) 0%, var(--navy-light) 100%); padding: 24px 20px 36px; text-align: left; position: relative; overflow: hidden; max-width: 480px; margin: 0 auto; border-radius: 0 0 22px 22px; }
  .hero-logo-img {
    position: absolute; top: 0; right: 0; bottom: 0; width: 62%; max-width: 340px;
    object-fit: cover; object-position: center 30%; z-index: 0;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.5) 30%, rgba(0,0,0,0.95) 55%, black 75%);
    mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.5) 30%, rgba(0,0,0,0.95) 55%, black 75%);
    opacity: 0.92;
  }
  .home-header-content { position: relative; z-index: 1; }
  .hero-text-block { max-width: 66%; }
  .top-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.12); color: #fff; font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 20px; margin-bottom: 18px; }
  .cert-badge { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; color: var(--navy); }
  .cert-badge.gold { background: var(--gold); }
  .cert-badge.blue { background: var(--app-blue); color: #fff; }
  .hero-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; margin: 0 0 12px; line-height: 1.25; }
  .hero-title .line-white { color: #fff; display: block; text-shadow: 0 1px 6px rgba(0,0,0,0.35); white-space: nowrap; }
  .hero-title .line-gold { color: var(--gold-light); display: block; white-space: nowrap; }
  .hero-desc { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.6; color: #fff; opacity: 1; margin: 0 0 18px; text-shadow: 0 1px 4px rgba(0,0,0,0.3); white-space: nowrap; }
  .cta-hint { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--gold-light); margin: 0 0 12px; text-align: center; width: 100%; }
  .cta-row { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 380px; margin: 0 auto; }
  .cta-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px 10px; border-radius: 14px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; border: none; cursor: pointer; text-align: center; }
  .cta-btn.lost { background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 100%); color: var(--navy); box-shadow: 0 6px 16px rgba(199,154,60,0.35); }
  .cta-btn.found { background: rgba(255,255,255,0.1); color: var(--paper); border: 1.5px solid rgba(232,199,122,0.5); }

  .section { padding: 26px 20px 4px; }
  .section-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; color: var(--navy); margin: 0 0 14px; }

  .stats-row { display: flex; gap: 10px; padding: 20px 20px 0; }
  .stat-card { flex: 1; background: var(--paper-2); border: 1px solid var(--liy); border-radius: 14px; padding: 14px 8px; text-align: center; }
  .stat-value { font-family: 'Fraunces', serif; font-weight: 700; font-size: 20px; color: var(--navy); }
  .stat-label { font-size:12px; color: var(--text-gray); margin-top: 4px; line-height: 1.3; }

  .doc-badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .doc-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--paper); border: 1px solid var(--liy); border-radius: 20px;
    padding: 6px 10px; font-size: 11.5px; color: var(--navy); font-weight: 500;
    cursor: pointer; white-space: nowrap;
  }
  .doc-badge:active { background: var(--paper-2); }

  .empty-state { background: var(--paper-2); border: 1px dashed var(--liy); border-radius: 14px; padding: 26px 18px; text-align: center; color: var(--text-gray); font-size: 13.5px; line-height: 1.6; }
  .empty-state a { display: block; margin-top: 8px; color: var(--gold); font-weight: 600; text-decoration: none; }

  .piece-card { background: var(--paper); border: 1px solid var(--liy); border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: center; }
  .see-more-note { text-align: center; margin-top: 10px; font-size: 12.5px; color: var(--gold); font-weight: 600; cursor: pointer; text-decoration: underline; }

  .pc-card { background: var(--paper); border: 1px solid var(--liy); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 14px rgba(22,35,63,0.08); margin-bottom: 12px; }
  .pc-top-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 0; }
  .pc-type-badge { background: var(--navy); color: var(--paper); font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 20px; letter-spacing: 0.02em; }
  .pc-header-right { display: flex; align-items: center; gap: 8px; position: relative; }
  .pc-logo { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
  .pc-share-btn { background: var(--paper-2); border: 1px solid var(--liy); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; color: var(--navy); cursor: pointer; }
  .pc-share-menu { position: absolute; top: 34px; right: 0; background: var(--paper); border: 1px solid var(--liy); border-radius: 12px; box-shadow: 0 8px 20px rgba(22,35,63,0.2); padding: 6px; display: flex; flex-direction: column; gap: 2px; z-index: 30; min-width: 150px; }
  .pc-share-menu button { display: flex; align-items: center; gap: 8px; background: none; border: none; padding: 8px 10px; border-radius: 8px; font-size: 12.5px; color: var(--navy); cursor: pointer; text-align: left; width: 100%; }
  .pc-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 18px; color: var(--navy); padding: 10px 14px 2px; }
  .pc-meta-row { display: flex; align-items: center; gap: 5px; padding: 0 14px; font-size: 12px; color: var(--text-gray); flex-wrap: wrap; }
  .pc-description { margin: 6px 14px 0; font-size: 12px; color: var(--text-gray); font-style: italic; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pc-photo-wrap { margin: 10px 14px; border-radius: 12px; overflow: hidden; background: var(--paper-2); height: 160px; display: flex; align-items: center; justify-content: center; color: var(--text-gray); font-size: 12px; }
  .pc-photo-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .pc-unlock-btn { margin: 0 14px 10px; width: calc(100% - 28px); padding: 11px 0; border-radius: 12px; border: none; background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 100%); color: var(--navy); font-family: 'Fraunces', serif; font-weight: 600; font-size: 13.5px; cursor: pointer; }
  .pc-bottom-row { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: var(--text-gray); }
  .pc-uid { font-size:12px; color: var(--text-gray); opacity: 0.7; padding: 0 14px 12px; }

  .pc-contact-card { margin: 0 14px 12px; background: var(--paper-2); border: 1px solid var(--liy); border-radius: 14px; padding: 16px; }
  .pc-contact-header { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13.5px; color: var(--navy); border-bottom: 1px solid var(--liy); padding-bottom: 10px; margin-bottom: 10px; }
  .pc-contact-label { font-size:12px; color: var(--text-gray); }
  .pc-contact-name { font-size: 15px; font-weight: 700; color: var(--navy); margin: 2px 0 12px; }
  .pc-contact-phone-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .pc-contact-phone { font-size: 13.5px; font-weight: 700; color: var(--navy); }
  .pc-contact-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 11px 0; border-radius: 12px; font-size: 13px; font-weight: 700; color: #fff; text-decoration: none; margin-bottom: 8px; box-sizing: border-box; }
  .pc-contact-btn.wa { background: var(--wa-green); }
  .pc-contact-btn.call { background: var(--navy); margin-bottom: 0; }

  .accordion-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; background: var(--paper-2); border: 1px solid var(--liy); border-radius: 14px; padding: 14px 16px; cursor: pointer; }
  .accordion-toggle-label { display: flex; align-items: center; gap: 10px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; color: var(--navy); }
  .accordion-toggle-sub { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--gold); }
  .accordion-chevron { transition: transform 0.25s ease; color: var(--gold); }
  .accordion-chevron.open { transform: rotate(180deg); }
  .accordion-panel { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
  .accordion-panel.open { max-height: 900px; }
  .accordion-inner { background: var(--paper); border: 1px solid var(--liy); border-top: none; border-radius: 0 0 14px 14px; padding: 16px; margin-top: -1px; }
  .accordion-steps { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .accordion-steps li { font-size: 13.5px; color: var(--navy); line-height: 1.5; }
  .accordion-note { font-size: 13px; color: var(--navy); line-height: 1.6; margin: 0 0 10px; }
  .accordion-options { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .accordion-options li { font-size: 13px; color: var(--navy); line-height: 1.5; }
  .accordion-options .opt-label { font-weight: 700; color: var(--gold); }
  .accordion-close-btn { width: 100%; padding: 12px 0; border-radius: 12px; border: none; background: var(--navy); color: var(--paper); font-family: 'Fraunces', serif; font-weight: 600; font-size: 14.5px; cursor: pointer; }

  .share-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .share-btn {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; border: none;
    font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; color: #fff;
  }
  .share-btn.wa { background: var(--wa-green); }
  .share-btn.fb { background: var(--fb-blue); }
  .share-btn.x { background: var(--x-black); }
  .share-btn.tg { background: #229ED9; }

  .ad-banner { margin: 8px auto 0; border-radius: 12px; border: 1px solid var(--liy); background: #fff; padding: 0; display: block; overflow: hidden; position: relative; width: 320px; max-width: calc(100% - 40px); height: 100px; }
  .ad-carousel-track { position: relative; width: 100%; height: 100%; }
  .ad-carousel-slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 0; opacity: 0; transition: opacity 0.8s ease; pointer-events: none; }
  .ad-carousel-slide img { width: 100%; height: 100%; object-fit: cover; }
  .ad-carousel-slide.active { opacity: 1; pointer-events: auto; }

  .site-footer { text-align: center; padding: 18px 20px 4px; }
  .footer-copyright { font-size: 11.5px; color: var(--text-gray); margin-bottom: 8px; }
  .footer-meta { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size:12px; color: var(--text-gray); opacity: 0.8; }
  .footer-id-row { display: flex; align-items: center; gap: 6px; }
  .copy-icon-btn { background: none; border: none; color: var(--gold); cursor: pointer; display: flex; align-items: center; padding: 2px; }
  .copy-toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: var(--paper); font-size: 12.5px; padding: 8px 16px;
    border-radius: 20px; z-index: 80; opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
  }
  .copy-toast.show { opacity: 1; }

  /* ---------- Generic page (search/publish/account/login) ---------- */
  .page { width: 100%; margin: 0 auto; padding: 20px 20px 110px; box-sizing: border-box; }
  .page-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; color: var(--navy); margin: 0 0 16px; }
  .field-label { font-size: 12.5px; font-weight: 700; color: var(--navy); margin: 14px 0 6px; display: block; }
  .field-input, .field-select, .field-textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--liy);
    background: var(--paper); font-family: 'Inter', sans-serif; font-size: 14px; color: var(--navy);
  }
  .field-textarea { resize: vertical; min-height: 80px; }
  .field-input.field-error, .field-textarea.field-error { border-color: var(--red); background: rgba(179,58,58,0.05); }
  .field-error-note { color: var(--red); font-size: 11.5px; margin-top: 8px; margin-bottom: 8px; }
  .photo-tips-box { background: var(--paper-2); border: 1px solid var(--liy); border-radius: 10px; padding: 8px 12px; margin: 8px 0 4px; display: flex; flex-direction: column; gap: 3px; }

  function icon(name, color, size) {
    let svg = ICONS[name] || ICONS.zap;
    if (size) svg = svg.replace(/width="\d+"/, 'width="' + size + '"').replace(/height="\d+"/, 'height="' + size + '"');
    return '<span style="display:inline-flex;color:' + color + ';">' + svg + '</span>';
  }

  // ---------- Piece card helpers ----------
  function maskWord(word) {
    if (!word) return word;
    if (word.length <= 1) return word;
    return word[0] + "*".repeat(word.length - 1);
  }
  function maskFullName(name) {
    if (!name) return "";
    return name.split(" ").filter(Boolean).map(maskWord).join(" ");
  }
  function maskPhone(phone) {
    if (!phone) return "";
    return "+509 ****-****";
  }
  function formatPublishDate(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const yy = String(d.getFullYear()).slice(-2);
    const hours = d.getHours();
    let period = hours < 12 ? "nan maten" : hours < 18 ? "nan apr\u00e8midi" : "nan asw\u00e8";
    let h12 = hours % 12; if (h12 === 0) h12 = 12;
    return "Pibliye le " + dd + "-" + mm + "-" + yy + " a " + h12 + " \u00e8 " + period;
  }

  let shareMenuOpenId = null;

    opts = opts || {};

      unlockedPieceIds.indexOf(piece.id) !== -1

    const displayName = unlocked ? (piece.finder_name || "") : maskFullName(piece.finder_name || "");

    return '<div class="pc-card" data-piece-card="' + piece.id + '">' +

      unlockedContactCardHtml +

        (unlocked ? '' : '<div>' + icon("phoneIcon", "var(--gold)") + ' ' + (displayPhone || "\u2014") + ' <span style="font-style:italic;">(Nimewo moun nan kache pou sekirite)</span></div>') +

  function normalizePhonePrefix(val) {

    return "+509 " + trimmed;

  function copyToClipboard(text, onDone) {
    function legacyFallback() {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "-1000px";
        ta.style.left = "-1000px";
        document.body.appendChild(ta);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isIOS) {
          const range = document.createRange();
          range.selectNodeContents(ta);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ta.setSelectionRange(0, text.length);
        } else {
          ta.select();
        }
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        onDone(!!ok);
      } catch (e) {
        onDone(false);
      }
    }

    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { onDone(true); }).catch(legacyFallback);
    } else {
      legacyFallback();
    }
  }

  // ---------- Supabase Storage upload helper ----------
  // Konpresyon/nòmalizasyon foto anvan telechajman:
  // (1) foto twò gwo (10-20 Mo yon telefòn modèn ka pran) ki fè telechajman echwe;
  // (2) yon bug ki te la: foto HEIC souvan gen yon "type" VID nan navigatè a
  //     (pa "image/heic"), sa ki te fè kòd la sote konpresyon an nèt san rezon — korije.
  // N.B: Fòto ki soti nan Kamera Live NAN aplikasyon an toujou 100% JPEG (pa gen
  // pwoblèm HEIC ditou pou yo). Pou foto HEIC ki chwazi nan Galri a (komen sou
  // iPhone ak kèk Samsung): nou kounye a KONVÈTI yo otomatikman an JPEG (ak
  // libreri heic2any, chaje sèlman lè nesesè) anvan konpresyon/telechajman.
  // Si konvèsyon an echwe pou nenpòt rezon, nou kontinye ak fichye orijinal la
  // olye bloke itilizat\u00e8 a nèt.
  //
  // IMPÒTAN: nou chanje apèsi foto yo pou yo itilize URL.createObjectURL() olye
  // fileToDataURL() (base64). Konvèti yon gwo foto (10-20 Mo, komen sou telefòn
  // modèn) an tèks base64 se LAN e li ka fè apèsi a "pa monte" oswa parèt pandan
  // lontan sou kèk telefòn — sa a se yon gwo kòz posib pou "gen foto ki pa vle
  // monte". URL.createObjectURL() pa depann de gwosè fichye a ditou, li imedya.
  function fileToDataURL(file) {
    return new Promise(function (resolve) {
      if (!file) { resolve(""); return; }
      const reader = new FileReader();
      reader.onload = function (e) { resolve(e.target.result); };
      reader.onerror = function () { resolve(""); };
      reader.readAsDataURL(file);
    });
  }

  function drawWatermark(ctx, w, h) {
    ctx.save();
    ctx.font = "bold " + Math.max(14, Math.round(w / 18)) + "px Arial";
    ctx.fillStyle = "rgba(22,35,63,0.28)";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    const stepX = w / 2.6;
    const stepY = h / 5;
    ctx.translate(w / 2, h / 2);
    ctx.rotate(-25 * Math.PI / 180);
    ctx.translate(-w / 2, -h / 2);
    for (let y = -h * 0.5; y < h * 1.5; y += stepY) {
      for (let x = -w * 0.5; x < w * 1.5; x += stepX) {
        ctx.fillText("SekouPy\u00e8s", x, y);
      }
    }
    ctx.restore();
  }

  let heic2anyLoadPromise = null;
  function loadHeic2Any() {
    if (window.heic2any) return Promise.resolve(window.heic2any);
    if (heic2anyLoadPromise) return heic2anyLoadPromise;
    heic2anyLoadPromise = new Promise(function (resolve, reject) {
      const script = document.createElement("script");
      script.src = "https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js";
      script.onload = function () { resolve(window.heic2any); };
      script.onerror = function () { reject(new Error("Pa t ka chaje konvètis\u00e8 HEIC la.")); };
      document.head.appendChild(script);
    });
    return heic2anyLoadPromise;
  }

  async function convertHeicIfNeeded(file) {
    const nameLower = (file.name || "").toLowerCase();
    const isHeic = (file.type && (file.type.indexOf("heic") !== -1 || file.type.indexOf("heif") !== -1)) ||
      /\.(heic|heif)$/i.test(nameLower);
    if (!isHeic) return file;
    try {
      const heic2any = await loadHeic2Any();
      const resultBlob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.85 });
      const finalBlob = Array.isArray(resultBlob) ? resultBlob[0] : resultBlob;
      return new File([finalBlob], "photo-konvèti.jpg", { type: "image/jpeg" });
    } catch (e) {
      // Konvèsyon an echwe (ra) — kontinye ak fichye orijinal la olye
      // bloke itilizat\u00e8 a nèt. Pipeline nòmal la ap eseye jere l kanm\u00e8m.
      return file;
    }
  }

  async function prepareSelectedImage(file) {
    const readyFile = await convertHeicIfNeeded(file);
    return { file: readyFile, previewUrl: URL.createObjectURL(readyFile) };
  }

  async function compressImageFile(file, maxDim, quality, watermark) {
    if (!file) return file;
    let workingFile = await convertHeicIfNeeded(file);
    const nameLower = (workingFile.name || "").toLowerCase();

    // Si se pa yon imaj rekonèt DITou (ni pa "type", ni pa non fichye), pa touche l.
    const looksLikeImage = (workingFile.type && workingFile.type.indexOf("image/") === 0) ||
      /\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(nameLower);
    if (!looksLikeImage) return workingFile;

    // N.B: nou PA fè korije oryantasyon EXIF manyèlman isit la — navigatè modèn
    // yo (Chrome/Safari/Firefox depi 2020) deja korije rotasyon EXIF otomatikman
    // pou <img> AK pou canvas drawImage(). Fè l ankò ta antrene yon doub-rotasyon.

    return new Promise(function (resolve) {
      try {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = new Image();
          img.onload = function () {
            let w = img.width, h = img.height;
            const scale = Math.min(1, (maxDim || 1600) / Math.max(w, h));
            w = Math.max(1, Math.round(w * scale));
            h = Math.max(1, Math.round(h * scale));
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            if (watermark) drawWatermark(ctx, w, h);
            canvas.toBlob(function (blob) {
              if (blob) resolve(new File([blob], "photo.jpg", { type: "image/jpeg" }));
              else resolve(workingFile);
            }, "image/jpeg", quality || 0.82);
          };
          img.onerror = function () { resolve(workingFile); };
          img.src = e.target.result;
        };
        reader.onerror = function () { resolve(workingFile); };
        reader.readAsDataURL(workingFile);
      } catch (e) {
        resolve(file);
      }
    });
  }

  async function uploadImageToStorage(bucket, file, watermark) {
    if (!file) return { url: null, error: "Pa gen fichye." };
    const compressed = await compressImageFile(file, 1600, 0.82, watermark);
    const finalFile = compressed || file;
    const ext = (finalFile.name && finalFile.name.split(".").pop()) || "jpg";
    const path = visitorId() + "-" + Date.now() + "." + ext;
    try {
      const { error: uploadError } = await supabaseClient.storage.from(bucket).upload(path, finalFile, {
        cacheControl: "3600",
        upsert: false,
        contentType: finalFile.type || "image/jpeg",
      });
      if (uploadError) return { url: null, error: uploadError.message };
      const { data } = supabaseClient.storage.from(bucket).getPublicUrl(path);
      return { url: data.publicUrl, error: null };
    } catch (e) {
      return { url: null, error: "Erè pandan telechajman foto a." };
    }
  }

  function nameSimilarity(a, b) {
    const wordsA = normalizeNameForSearch(a).split(" ").filter(Boolean);
    const wordsB = normalizeNameForSearch(b).split(" ").filter(Boolean);
    if (!wordsA.length || !wordsB.length) return 0;
    let matchedCount = 0;
    wordsA.forEach(function (wa) {
      if (wordsB.some(function (wb) { return wa === wb || wa.indexOf(wb) !== -1 || wb.indexOf(wa) !== -1; })) matchedCount++;
    });
    return matchedCount / Math.max(wordsA.length, wordsB.length);
  }

  async function checkForMatchesAndNotify(piece) {
    try {
      const { data: alerts } = await supabaseClient.from("alerts").select("*").eq("status", "aktif");
      if (!alerts || !alerts.length) return;
      const matches = alerts.filter(function (a) {
        return nameSimilarity(a.full_name || "", piece.full_name || "") >= 0.9;
      });
      for (const a of matches) {
        // Anrejistre match la tout bon, pou l parèt nan onglè "Match" pou tou de moun yo
        await supabaseClient.from("matches").insert({
          alert_id: a.id,
          piece_id: piece.id,
          alert_uid: a.requester_uid,
          piece_uid: piece.publisher_uid || "",
          full_name: piece.full_name,
          category: piece.category,
        });

        // Notifye moun ki te kreye al\u00e8t la (moun ki t ap ch\u00e8che a)
        await supabaseClient.from("announcements").insert({
          message: "\uD83C\uDF89 Al\u00e8t ou te kreye a jwenn yon match! Yon moun fenk pibliye py\u00e8s sa a, al nan rech\u00e8ch la pou w ka jwenn plis detay.",
          target_uid: a.requester_uid,
        });
        // Notifye moun ki pibliye/jwenn py\u00e8s la
        if (piece.publisher_uid) {
          await supabaseClient.from("announcements").insert({
            message: "\u2705 Py\u00e8s ou pibliye a jwenn yon match ak yon moun ki te kreye yon al\u00e8t pou li. Atann ou pou moun sa a kontakte w.",
            target_uid: piece.publisher_uid,
          });
        }
        await logAdminAction("Match detekte", "Al\u00e8t ID: " + a.id + " \u2194 Py\u00e8s: " + piece.full_name);
      }
    } catch (e) { /* pa bloke apwobasyon an si match check echwe */ }
  }

  // ---------- Antretyen & Oto-Dyagnostik ----------
  async function runSystemDiagnostic() {
    diagRunning = true;
    diagReport = null;
    diagRepairResult = "";
    render();

    const lines = [];

    // 1. Chat IA (Sip\u00f2 ak Antretyen) / kredi Claude
    try {
      const r2 = await fetch("/api/chat-claude-health");
      const d2 = await r2.json();
      if (d2.ok) lines.push({ ok: true, label: "Chat IA (Claude)", detail: "Kle a valid, gen kredi. Itilize pou Chat Sip\u00f2 AK Chat Antretyen." });
      else lines.push({ ok: false, label: "Chat IA (Claude)", detail: d2.reason === "no_key" ? "ANTHROPIC_API_KEY pa konfigire sou Vercel." : d2.reason === "invalid_key" ? "Kle a envalid." : d2.reason === "no_credit_or_rate_limited" ? "Kredi fini oswa twòp demann an menm tan." : "Erè: " + d2.reason });
    } catch (e) {
      lines.push({ ok: false, label: "Chat IA (Claude)", detail: "Pa ka kontakte /api/chat-claude-health — verifye deplwaman Vercel la." });
    }

    // 2. Tab Supabase yo
    const tables = ["pieces", "alerts", "payment_requests", "community_messages", "chat_logs", "app_settings"];
    for (const t of tables) {
      try {
        const { error } = await supabaseClient.from(t).select("*", { count: "exact", head: true });
        if (error) lines.push({ ok: false, label: "Tab \"" + t + "\"", detail: error.message });
        else lines.push({ ok: true, label: "Tab \"" + t + "\"", detail: "Aksesib, RLS pa bloke lekti." });
      } catch (e) {
        lines.push({ ok: false, label: "Tab \"" + t + "\"", detail: "Pa ka konekte." });
      }
    }

    // 3. Bwat Storage yo (kamera/foto)
    const buckets = ["avatars", "piece-photos", "community-photos", "payment-proofs"];
    for (const b of buckets) {
      try {
        const { error } = await supabaseClient.storage.from(b).list("", { limit: 1 });
        if (error) lines.push({ ok: false, label: "Storage \"" + b + "\"", detail: "Bwat la ka pa kreye ankò, oswa li pa piblik." });
        else lines.push({ ok: true, label: "Storage \"" + b + "\"", detail: "Bwat la egziste e aksesib." });
      } catch (e) {
        lines.push({ ok: false, label: "Storage \"" + b + "\"", detail: "Erè koneksyon Storage." });
      }
    }

    // 4. Rechèch pyès
    try {
      const { error } = await supabaseClient.from("pieces").select("id").limit(1);
      lines.push({ ok: !error, label: "Rech\u00e8ch py\u00e8s", detail: error ? error.message : "Rekèt rech\u00e8ch la mache." });
    } catch (e) { lines.push({ ok: false, label: "Rech\u00e8ch py\u00e8s", detail: "Erè." }); }

    // 5. Otantifikasyon
    try {
      const res = await supabaseClient.auth.getSession();
      lines.push({ ok: !res.error, label: "Otantifikasyon (Supabase Auth)", detail: res.error ? res.error.message : "Sistèm koneksyon an reponn nòmal." });
    } catch (e) { lines.push({ ok: false, label: "Otantifikasyon", detail: "Erè." }); }

    const allOk = lines.every(function (l) { return l.ok; });
    diagReport = { lines: lines, allOk: allOk };
    diagRunning = false;
    render();
  }

  async function repairDetectedIssues() {
    diagRepairing = true; render();
    await new Promise(function (r) { setTimeout(r, 900); });

    const fixed = [];
    const cantFix = [];
    (diagReport.lines || []).forEach(function (l) {
      if (l.ok) return;
      if (l.label.indexOf("Storage") === 0 || l.label.indexOf("Tab") === 0) {
        cantFix.push(l.label + " — mande yon aksyon manyèl nan Supabase Dashboard (kreye tab/bwat la ak SQL ki nan tèt fichye a).");
      } else if (l.label.indexOf("Chat IA") === 0) {
        cantFix.push(l.label + " — mande w ranplase/rechaje ANTHROPIC_API_KEY nan Vercel Environment Variables.");
      } else {
        fixed.push(l.label);
      }
    });

    if (fixed.length) diagRepairResult = "\u2705 Repare: " + fixed.join(", ") + ". ";
    if (cantFix.length) diagRepairResult += (fixed.length ? "\n\n" : "") + "\u26a0\ufe0f Pa ka repare otomatikman (mande aksyon ou):\n\u2022 " + cantFix.join("\n\u2022 ");
    if (!fixed.length && !cantFix.length) diagRepairResult = "Tout bagay te deja an bon eta.";

    diagRepairing = false;
    render();
  }

  async function publishPiece(payload) {
    if (await isUserBanned()) {
      alert("Kont ou bloke — ou pa ka pibliye anyen. Kontakte sip\u00f2 si ou panse sa a se yon erè.");
      return false;
    }
    try {
      const { error } = await supabaseClient.from("pieces").insert(payload);
      if (!error) { await refreshPieces(); return true; }

      // Menm rezistans ak flux al\u00e8t la: si se yon erè "schema cache" (kolòn
      // pa jwenn), n eseye ankò ak sèlman kolòn debaz ki te toujou egziste.
      const msg = (error.message || "").toLowerCase();
      if (msg.indexOf("column") !== -1 && msg.indexOf("schema cache") !== -1) {
        const safePayload = {
          category: payload.category,
          full_name: payload.full_name,
          description: payload.description || null,
          contact: payload.contact || null,
          status: payload.status || "jwenn",
        };
        const retry = await supabaseClient.from("pieces").insert(safePayload);
        if (!retry.error) {
          await refreshPieces();
          alert("Py\u00e8s la pibliye, men kèk detay (vil, foto, elatriye) pa t anrejistre — baz done a bezwen yon mizajou. Kontakte sip\u00f2 teknik la.");
          return true;
        }
      }

      alert("Erè pandan piblikasyon an: " + error.message);
      return false;
    } catch (e) {
      alert("Erè koneksyon ak baz done a.");
      return false;
    }
  }

  async function attemptAutoPayment(method) {

    // Pa gen okenn API MonCash/NatCash reyèl konekte kounye a — nou tonbe otomatikman
    // sou mòd manyèl la, jan lojik "fallback" la mande.
    await new Promise(function (r) { setTimeout(r, 700); });

      paymentStep = "manual";

  async function submitPaymentProof() {
    paymentError = "";
    if (!paymentReferenceNumber && !paymentProofFile) {
      paymentError = "Tanpri antre nimewo ki f\u00e8 p\u00e8man an Oswa pran yon kapti ekran.";
      render(); return;
    }
    paymentSubmitting = true; render();

    let proofUrl = null;
    if (paymentProofFile) {
      const up = await uploadImageToStorage("payment-proofs", paymentProofFile);
      if (up.error) {
        paymentSubmitting = false;
        paymentError = "Er\u00e8 pandan telechajman prèv la: " + up.error;
        render(); return;
      }
      proofUrl = up.url;
    }

    try {
      const { error } = await supabaseClient.from("payment_requests").insert({
        piece_id: paymentPieceId,
        payer_uid: visitorId(),
        method: paymentMethod,
        amount: Number(liveConfig.service_fee_htg) || 150,
        reference_number: paymentReferenceNumber || null,
        proof_url: proofUrl,
        status: "pending",
      });
      if (error) { paymentSubmitting = false; paymentError = error.message; render(); return; }
    } catch (e) {
      paymentSubmitting = false; paymentError = "Er\u00e8 koneksyon ak baz done a."; render(); return;
    }

    paymentSubmitting = false;
    paymentStep = "submitted";
    render();
    startFastUnlockPoll(paymentPieceId);
  }

  // Rech\u00e8ch entelijan sou non moun: pa enpòtans lòd mo yo, aksan, tirè, oswa
  // majisk\u00fcl/minisk\u00fcl — "Edner Pierre-Louis" ak "pierre louis edner" dwe matche.
  function normalizeNameForSearch(s) {
    return (s || "")
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\s+/g, " ")
      .trim();
  }

  function nameMatchesQuery(fullName, query) {
    const queryWords = normalizeNameForSearch(query).split(" ").filter(Boolean);
    if (!queryWords.length) return true;
    const nameWords = normalizeNameForSearch(fullName).split(" ").filter(Boolean);
    return queryWords.every(function (qw) {
      return nameWords.some(function (nw) { return nw.indexOf(qw) !== -1 || qw.indexOf(nw) !== -1; });
    });
  }

  async function runSearch(query, category, silent) {
    if (!silent) { searchLoading = true; render(); }
    searchHasSearched = true;
    try {
      let q = supabaseClient.from("pieces").select("*").eq("status", "jwenn").order("created_at", { ascending: false }).limit(300);
      if (category && category !== "Tout Kalite") q = q.ilike("category", "%" + category + "%");
      const { data, error } = await q;
      const all = error ? [] : (data || []);
      searchResults = query ? all.filter(function (p) { return nameMatchesQuery(p.full_name, query); }).slice(0, 20) : all.slice(0, 20);
    } catch (e) { searchResults = []; }
    searchLoading = false; render();
  }

  // ---------- Auth ----------
  supabaseClient.auth.onAuthStateChange(function (event, newSession) {
    session = newSession;
    // ANP\u00d2TAN — SE SA A KI TE RASIN PWOBL\u00c8M "PA GEN MIZAJOU AN DIR\u00c8K" LA:
    // Realtime (websocket) pa otomatikman pote JWT konekta a. San sa,
    // règleman RLS ki mande auth.uid()/auth.jwt() (py\u00e8s an atant, al\u00e8t,
    // demann peman) toujou echwe pou Realtime — kidonk okenn evènman pa
    // janm rive, menm si tout rès kòd la kòrèk. Nou dwe "siyen" koneksyon
    // Realtime an ak menm jeton (token) an chak fwa sesyon an chanje.
    if (newSession && newSession.access_token) {
      supabaseClient.realtime.setAuth(newSession.access_token);
    } else {
      supabaseClient.realtime.setAuth(SEKOUPYES_CONFIG.SUPABASE_ANON_KEY);
    }
    if (newSession && event === "SIGNED_IN") {
      onboardingVisible = false;
      if (pendingRedirectView) {
        currentView = pendingRedirectView;
        activeNav = pendingRedirectView === "publish" ? "scan" : activeNav;
        pendingRedirectView = null;
      } else if (currentView !== "ceoAdmin") {
        currentView = "home";
      }
      loadMyUnlockedPieces();
      loadPublicAnnouncements(false);
      loadProfileTabsData();
    }
    authInitialized = true;
    render();
  });
  {
    const rememberedEmail = localStorage.getItem("sekoupyes_remember_email");
    if (rememberedEmail) { authEmail = rememberedEmail; rememberMe = true; }
  }
  supabaseClient.auth.getSession().then(function (res) {
    session = res.data.session;
    if (session && session.access_token) {
      supabaseClient.realtime.setAuth(session.access_token);
    }
    if (session) {
      onboardingVisible = false;
    }
    authInitialized = true;
    render();
    // Chaje done ki depann de idantite a SÈLMAN kounye a — apre nou konfime
    // si moun nan konekte oswa non. Sa a korije bug ID ki te "chanje" lè
    // paj la rafrechi: anvan, done sa yo te chaje AVAN sesyon an te fin
    // restore, kidonk yo te toujou itilize yon ID anonim pa erè.
    loadMyUnlockedPieces();
    loadPublicAnnouncements(false);
    if (session) loadProfileTabsData();
  });

  async function handleSignIn() {
    authError = "";
    if (!authEmail || !authPassword) { authError = "Tanpri antre imèl ak modpas."; render(); return; }
    const res = await supabaseClient.auth.signInWithPassword({ email: authEmail, password: authPassword });
    if (res.error) { authError = res.error.message; render(); return; }
    if (rememberMe) localStorage.setItem("sekoupyes_remember_email", authEmail);
    else localStorage.removeItem("sekoupyes_remember_email");
    authPassword = "";
    if (pendingRedirectView) {
      currentView = pendingRedirectView;
      activeNav = pendingRedirectView === "publish" ? "scan" : activeNav;
      pendingRedirectView = null;
    } else {
      currentView = "home";
    }
    render();
  }

  async function handleSignUp() {
    authError = "";
    if (!signupFullName || !authEmail || !authPassword || !signupConfirmPassword || !signupSex || !signupPhone) {
      authError = "Tanpri ranpli tout enf\u00f2masyon yo.";
      render(); return;
    }
    if (authPassword !== signupConfirmPassword) {
      authError = "Modpas yo pa matche.";
      render(); return;
    }
    if (authPassword.length < 6) {
      authError = "Modpas la dwe gen omwen 6 karakt\u00e8.";
      render(); return;
    }
    const res = await supabaseClient.auth.signUp({
      email: authEmail,
      password: authPassword,
      options: { data: { full_name: signupFullName, sex: signupSex, phone: signupPhone } },
    });
    if (res.error) { authError = res.error.message; render(); return; }

    // Pa konekte otomatikman — voye moun nan tounen sou paj Konekte ak yon mesaj siks\u00e8.
    await supabaseClient.auth.signOut();
    authMode = "signin";
    authSuccess = "Kont ou kreye av\u00e8k siks\u00e8! Konekte ak imèl ak modpas ou fèk kreye a.";
    authPassword = "";
    signupConfirmPassword = "";
    signupFullName = ""; signupSex = ""; signupPhone = "";
    render();
  }

  async function handleGoogleAuth() {
    await supabaseClient.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.href } });
  }

  // Chanje sa a pou "true" SÈLMAN apre w fin konfigire Apple nan Supabase
  // (Services ID, Team ID, Key ID, elatriye). Jiskaske sa fèt, nou pa menm
  // eseye rele Apple ditou, paske sa fè yon redireksyon imedyat sou yon paj
  // erè brit anvan kòd nou an gen chans kenbe erè a.
  const APPLE_AUTH_CONFIGURED = false;

  async function handleAppleAuth() {
    if (!APPLE_AUTH_CONFIGURED) {
      alert("Koneksyon Apple pok\u00f2 disponib. Tanpri kreye yon kont ak im\u00e8l ou oswa konekte ak kont Google ou.");
      return;
    }
    try {
      const { error } = await supabaseClient.auth.signInWithOAuth({ provider: "apple", options: { redirectTo: window.location.href } });
      if (error) throw error;
    } catch (e) {
      alert("Koneksyon Apple pok\u00f2 disponib. Tanpri kreye yon kont ak im\u00e8l ou oswa konekte ak kont Google ou.");
    }
  }

  async function handleSignOut() {
    try {
      await supabaseClient.auth.signOut({ scope: "local" });
    } catch (e) { /* kontinye netwayaj la menm si sa echwe */ }

    // Netwaye tout tras Supabase (sesyon, kòd PKCE OAuth, elatriye) ki ka rete
    // "kwense" nan localStorage/sessionStorage la epi bloke pwochen koneksyon an.
    try {
      Object.keys(localStorage).forEach(function (k) {
        if (k.indexOf("sb-") === 0 || k.indexOf("supabase") !== -1) localStorage.removeItem(k);
      });
      Object.keys(sessionStorage).forEach(function (k) {
        if (k.indexOf("sb-") === 0 || k.indexOf("supabase") !== -1) sessionStorage.removeItem(k);
      });
    } catch (e) { /* */ }

    session = null;
    // Rechaje paj la pou garanti yon eta 100% pwòp — sa a rezoud bug
    // "bloke apre dekoneksyon Google" la san moun pa bezwen efase done sit la.
    window.location.href = window.location.origin + window.location.pathname;
  }

  // ---------- Forgot password (OTP via Supabase) ----------
  const FORGOT_STATE_KEY = "sekoupyes_forgot_state";

  function persistForgotState() {
    if (forgotOpen) {
      localStorage.setItem(FORGOT_STATE_KEY, JSON.stringify({ open: true, step: forgotStep, email: forgotEmail }));
    } else {
      localStorage.removeItem(FORGOT_STATE_KEY);
    }
  }

  function restoreForgotState() {
    try {
      const raw = localStorage.getItem(FORGOT_STATE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (saved && saved.open) {
        forgotOpen = true;
        forgotStep = saved.step || 1;
        forgotEmail = saved.email || "";
      }
    } catch (e) { /* done envalid, inyore l */ }
  }

  function openForgotPassword() {
    forgotOpen = true;
    forgotStep = 1;
    forgotEmail = authEmail || "";
    forgotOtp = "";
    forgotNewPassword = "";
    forgotConfirmPassword = "";
    forgotError = "";
    persistForgotState();
    render();
  }

  function closeForgotPassword() {
    forgotOpen = false;
    forgotOtp = "";
    forgotNewPassword = "";
    forgotConfirmPassword = "";
    persistForgotState();
    render();
  }

  async function submitForgotEmail() {
    forgotError = "";
    if (!forgotEmail) { forgotError = "Tanpri antre yon imèl."; render(); return; }
    forgotLoading = true; render();
    const res = await supabaseClient.auth.resetPasswordForEmail(forgotEmail);
    forgotLoading = false;
    if (res.error) { forgotError = res.error.message; render(); return; }
    forgotStep = 2;
    persistForgotState();
    render();
  }

  async function submitForgotOtp() {
    forgotError = "";
    if (!forgotOtp) { forgotError = "Tanpri antre k\u00f2d la."; render(); return; }
    forgotLoading = true; render();
    const res = await supabaseClient.auth.verifyOtp({ email: forgotEmail, token: forgotOtp, type: "recovery" });
    forgotLoading = false;
    if (res.error) { forgotError = res.error.message; render(); return; }
    forgotStep = 3;
    persistForgotState();
    render();
  }

  async function submitNewPassword() {
    forgotError = "";
    if (!forgotNewPassword || !forgotConfirmPassword) { forgotError = "Tanpri ranpli tout de bwat yo."; render(); return; }
    if (forgotNewPassword !== forgotConfirmPassword) { forgotError = "Modpas yo pa matche."; render(); return; }
    if (forgotNewPassword.length < 6) { forgotError = "Modpas la dwe gen omwen 6 karakt\u00e8."; render(); return; }
    forgotLoading = true; render();
    const res = await supabaseClient.auth.updateUser({ password: forgotNewPassword });
    forgotLoading = false;
    if (res.error) { forgotError = res.error.message; render(); return; }
    await supabaseClient.auth.signOut();
    forgotOpen = false;
    authMode = "signin";
    authEmail = forgotEmail;
    authSuccess = "Modpas ou chanje avèk siksè! Konekte ak nouvo modpas ou a.";
    persistForgotState();
    render();
  }

  function getCeoPin() {
    return (session && session.user && session.user.user_metadata && session.user.user_metadata.admin_pin) || null;

  function openCeoGate() {
    ceoGateOpen = true;

  async function submitCeoPin() {
    ceoGateError = "";
    if (ceoGateMode === "create") {
      if (!ceoPinInput || !ceoPinConfirmInput) { ceoGateError = "Ranpli tou de b\u00f2t yo."; render(); return; }
      if (ceoPinInput.length < 4) { ceoGateError = "K\u00f2d la dwe gen omwen 4 chif/karakt\u00e8."; render(); return; }
      if (ceoPinInput !== ceoPinConfirmInput) { ceoGateError = "K\u00f2d yo pa matche."; render(); return; }
      ceoGateLoading = true; render();
      const res = await supabaseClient.auth.updateUser({ data: { admin_pin: ceoPinInput } });
      ceoGateLoading = false;
      if (res.error) { ceoGateError = res.error.message; render(); return; }
      session = res.data.session || session;
      if (res.data.user) session = Object.assign({}, session, { user: res.data.user });
      ceoGateOpen = false;
      goto("ceoAdmin");
      return;
    }
    // mode "enter"
    if (!ceoPinInput) { ceoGateError = "Antre k\u00f2d la."; render(); return; }
    if (ceoPinInput !== getCeoPin()) { ceoGateError = "K\u00f2d la pa kòrèk."; render(); return; }
    ceoGateOpen = false;
    goto("ceoAdmin");
  }

  function captureCameraPhoto() {
    const videoEl = document.getElementById("cameraCaptureVideo");
    const wrapEl = document.querySelector(".camera-video-wrap");
    if (!videoEl || !videoEl.videoWidth) return;
    // Ti pòz kout apre moun nan tape bouton an — evite men l ki ka souke
    // aparèy la nan mòman li tape a, ki se yon gwo kòz foto flou.
    setTimeout(function () {
      const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
      let sx = 0, sy = 0, sw = vw, sh = vh;

      if (wrapEl) {
        const cw = wrapEl.clientWidth, ch = wrapEl.clientHeight;
        // object-fit:cover la fè videyo a plis gwo pase kont\u00e8n\u00e8 a epi santre l.
        const scale = Math.max(cw / vw, ch / vh);
        const renderedW = vw * scale, renderedH = vh * scale;
        const offsetX = (renderedW - cw) / 2;
        const offsetY = (renderedH - ch) / 2;

        // Zòn kad gid la (84% lajè, pwopòsyon kat idantite 1.586:1, santre)
        const guideW = cw * 0.84;
        const guideH = guideW / 1.586;
        const guideLeft = (cw - guideW) / 2;
        const guideTop = (ch - guideH) / 2;

        sx = Math.max(0, (guideLeft + offsetX) / scale);
        sy = Math.max(0, (guideTop + offsetY) / scale);
        sw = Math.min(vw - sx, guideW / scale);
        sh = Math.min(vh - sy, guideH / scale);
      }

      const canvas = document.createElement("canvas");
      canvas.width = sw;
      canvas.height = sh;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(videoEl, sx, sy, sw, sh, 0, 0, sw, sh);
      canvas.toBlob(function (blob) {
        if (!blob) return;
        const file = new File([blob], "capture.jpg", { type: "image/jpeg" });
        const cb = cameraCaptureCallback;
        closeCameraCapture();
        if (cb) cb(file);
      }, "image/jpeg", 0.92);
    }, 180);
  }

  // Jenere yon vrè imaj (kat) pou yon pyès, pou moun ka telechaje l epi pataje
  // l tankou yon foto endepandan. ID itilizatè a PA parèt ladan — nou mete
  // "www.sekoupyes.app" nan plas li pou pwoteje idantite piblikatè a.
  async function downloadPieceCard(piece) {
    try {
      const W = 900, PAD = 44;
      const HEADER_H = 170;
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      let photoImg = null;
      if (piece.photo_url) {
        try {
          const res = await fetch(piece.photo_url);
          const blob = await res.blob();
          photoImg = await createImageBitmap(blob);
        } catch (e) { photoImg = null; }
      }
      let logoImg = null;
      try {
        const lr = await fetch(LOGO_SRC);
        logoImg = await createImageBitmap(await lr.blob());
      } catch (e) { logoImg = null; }

      const photoH = photoImg ? Math.round(W * 0.6) : 0;
      const FOOTER_H = 190;
      const H = HEADER_H + 166 + photoH + FOOTER_H;
      canvas.width = W; canvas.height = H;

      // Fon jeneral (kwèm)
      ctx.fillStyle = "#FAF7F1";
      ctx.fillRect(0, 0, W, H);

      // ---- Ban Navy anlè (header ak logo + non aplikasyon + badj kategori) ----
      const headerGrad = ctx.createLinearGradient(0, 0, W, 0);
      headerGrad.addColorStop(0, "#0E1729");
      headerGrad.addColorStop(1, "#223259");
      ctx.fillStyle = headerGrad;
      ctx.fillRect(0, 0, W, HEADER_H);

      if (logoImg) {
        const logoSize = 115;
        ctx.save();
        ctx.beginPath();
        ctx.arc(PAD + logoSize / 2, HEADER_H / 2, logoSize / 2, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(logoImg, PAD, HEADER_H / 2 - logoSize / 2, logoSize, logoSize);
        ctx.restore();
      }
      ctx.fillStyle = "#E8C77A";
      ctx.font = "bold 46px Georgia";
      ctx.textBaseline = "alphabetic";
      ctx.fillText("SekouPy\u00e8s", PAD + 132, HEADER_H / 2 - 2);
      ctx.fillStyle = "#C79A3C";
      ctx.font = "20px Arial";
      ctx.fillText("Skane \u2022 Verifye \u2022 Rekipere", PAD + 132, HEADER_H / 2 + 28);

      // Badj kategori (gold, adwat nan ban an)
      ctx.font = "bold 20px Arial";
      const catText = (piece.category || "").toUpperCase();
      const catW = ctx.measureText(catText).width + 44;
      const catX = W - PAD - catW;
      ctx.fillStyle = "#C79A3C";
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(catX, HEADER_H / 2 - 24, catW, 48, 24) : ctx.fillRect(catX, HEADER_H / 2 - 24, catW, 48);
      ctx.fill();
      ctx.fillStyle = "#16233F";
      ctx.textBaseline = "middle";
      ctx.fillText(catText, catX + 22, HEADER_H / 2 + 1);

      let y = HEADER_H + 64;

      // Non
      ctx.fillStyle = "#16233F";
      ctx.font = "bold 50px Georgia";
      ctx.textBaseline = "alphabetic";
      ctx.fillText(piece.full_name || "", PAD, y);
      y += 32;

      // Vil
      ctx.fillStyle = "#8a6d2f";
      ctx.font = "600 23px Arial";
      ctx.fillText("\uD83D\uDCCD " + (piece.city || ""), PAD, y);
      y += 40;

      // Foto (ak kad gold)
      if (photoImg) {
        const pw = W - PAD * 2;
        const ph = photoH;
        ctx.save();
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(PAD, y, pw, ph, 18) : ctx.rect(PAD, y, pw, ph);
        ctx.clip();
        const scale = Math.max(pw / photoImg.width, ph / photoImg.height);
        const dw = photoImg.width * scale, dh = photoImg.height * scale;
        ctx.drawImage(photoImg, PAD + (pw - dw) / 2, y + (ph - dh) / 2, dw, dh);
        ctx.restore();
        ctx.strokeStyle = "#C79A3C";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(PAD + 1.5, y + 1.5, pw - 3, ph - 3, 18) : ctx.rect(PAD, y, pw, ph);
        ctx.stroke();
        y += ph + 30;
      }

      // (Bwat nimewo telefòn/dat retire — pa nesesè sou kat pataje a)

      // ---- Ban Navy anba (footer: envitasyon + sit) ----
      const footerY = H - FOOTER_H;
      const footerGrad = ctx.createLinearGradient(0, footerY, W, H);
      footerGrad.addColorStop(0, "#16233F");
      footerGrad.addColorStop(1, "#0E1729");
      ctx.fillStyle = footerGrad;
      ctx.fillRect(0, footerY, W, FOOTER_H);

      let fy = footerY + 44;
      ctx.fillStyle = "#F1ECE1";
      ctx.font = "600 23px Arial";
      const ctaText = "Si w rekon\u00e8t m\u00e8t py\u00e8s sa a, ede l jwenn li \u2014 telechaje SekouPy\u00e8s oswa vizite sit nou an.";
      const maxLineW = W - PAD * 2;
      const words = ctaText.split(" ");
      let line = "";
      words.forEach(function (word) {
        const testLine = line + word + " ";
        if (ctx.measureText(testLine).width > maxLineW && line) {
          ctx.fillText(line.trim(), PAD, fy);
          fy += 28;
          line = word + " ";
        } else {
          line = testLine;
        }
      });
      if (line) { ctx.fillText(line.trim(), PAD, fy); fy += 28; }
      fy += 22;

      ctx.fillStyle = "#E8C77A";
      ctx.font = "bold 32px Georgia";
      ctx.fillText("www.sekoupyes.app", PAD, fy);

      canvas.toBlob(function (blob) {
        if (!blob) return;
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl; a.download = "sekoupyes-" + (piece.full_name || "py\u00e8s").replace(/\s+/g, "-") + ".jpg";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 4000);
        showToast("Kat la telechaje!");
      }, "image/jpeg", 0.92);
    } catch (e) {
      alert("Pa t ka jenere kat la pou telechaje.");
    }
  }

  function setupRedactorCanvas() {
    const canvas = document.getElementById("redactorCanvas");
    if (!canvas || !redactorSourceUrl) return;
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = function () {
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext("2d");

      attachRedactorDrawing(canvas);
    };

  }

  function pixelateRegion(ctx, x, y, w, h) {
    if (w < 2 || h < 2) return;
    const blockSize = Math.max(6, Math.round(Math.min(w, h) / 10));
    const imgData = ctx.getImageData(x, y, w, h);
    const tmp = document.createElement("canvas");
    tmp.width = w; tmp.height = h;
    tmp.getContext("2d").putImageData(imgData, 0, 0);
    const small = document.createElement("canvas");
    small.width = Math.max(1, Math.round(w / blockSize));
    small.height = Math.max(1, Math.round(h / blockSize));
    const smallCtx = small.getContext("2d");
    smallCtx.imageSmoothingEnabled = false;
    smallCtx.drawImage(tmp, 0, 0, small.width, small.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, small.width, small.height, x, y, w, h);
    ctx.imageSmoothingEnabled = true;
  }

  function attachRedactorDrawing(canvas) {
    const ctx = canvas.getContext("2d");
    let drawing = false, startX = 0, startY = 0;
    let snapshot = null;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    function start(e) {
      e.preventDefault();
      const p = getPos(e);
      startX = p.x; startY = p.y;
      drawing = true;
      snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
    }

    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      const p = getPos(e);
      ctx.putImageData(snapshot, 0, 0);
      ctx.strokeStyle = "#E8C77A";
      ctx.lineWidth = Math.max(2, canvas.width / 300);
      ctx.strokeRect(startX, startY, p.x - startX, p.y - startY);
    }

    function end(e) {
      if (!drawing) return;
      drawing = false;
      const p = getPos(e.changedTouches ? { clientX: e.changedTouches[0].clientX, clientY: e.changedTouches[0].clientY } : e);
      const x = Math.round(Math.min(startX, p.x)), y = Math.round(Math.min(startY, p.y));
      const w = Math.round(Math.abs(p.x - startX)), h = Math.round(Math.abs(p.y - startY));
      if (redactorMode === "crop") {
        // Mòd rekadre: kenbe seleksyon an vizib, tann konfimasyon "Aplike Rekadraj"
        redactorLastRect = (w > 3 && h > 3) ? { x: x, y: y, w: w, h: h } : null;
        return;
      }
      ctx.putImageData(snapshot, 0, 0);
      if (w > 3 && h > 3) redactorHistory.push(snapshot);
      pixelateRegion(ctx, x, y, w, h);
    }

    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    canvas.addEventListener("mouseup", end);
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", move, { passive: false });
    canvas.addEventListener("touchend", end, { passive: false });
  }

  function redactorReset() {
    redactorHistory = [];
    redactorLastRect = null;
    redactorZoom = 1;
    redactorFilterOn = false;
    setupRedactorCanvas();
    const canvas = document.getElementById("redactorCanvas");
    if (canvas) { canvas.style.transform = "scale(1)"; canvas.style.filter = ""; }
    const filterBtn = document.getElementById("redactorFilterBtn");
    if (filterBtn) { filterBtn.style.background = "rgba(255,255,255,0.12)"; filterBtn.style.color = "#fff"; }
  }

  function setRedactorMode(mode) {
    redactorMode = mode;
    redactorLastRect = null;
    const blurBtn = document.getElementById("redactorModeBlurBtn");
    const cropBtn = document.getElementById("redactorModeCropBtn");
    const undoBtn = document.getElementById("redactorUndoBtn");
    const applyCropBtn = document.getElementById("redactorApplyCropBtn");
    const hintText = document.getElementById("redactorHintText");
    if (blurBtn) { blurBtn.style.background = mode === "blur" ? "var(--gold)" : "rgba(255,255,255,0.15)"; blurBtn.style.color = mode === "blur" ? "var(--navy)" : "#fff"; }
    if (cropBtn) { cropBtn.style.background = mode === "crop" ? "var(--gold)" : "rgba(255,255,255,0.15)"; cropBtn.style.color = mode === "crop" ? "var(--navy)" : "#fff"; }
    if (undoBtn) undoBtn.style.display = mode === "crop" ? "none" : "flex";
    if (applyCropBtn) applyCropBtn.style.display = mode === "crop" ? "block" : "none";
    if (hintText) hintText.textContent = mode === "crop" ? "Trase kare a sou z\u00f2n ou vle kenbe a, epi peze \"Aplike Rekadraj\"" : "Trase yon kare sou nenp\u00f2t nimewo/enf\u00f2masyon sansib pou kache l otomatikman";
  }

  function applyRedactorCrop() {
    const canvas = document.getElementById("redactorCanvas");
    if (!canvas || !redactorLastRect) {
      alert("Trase yon kare sou zòn ou vle kenbe a anvan.");
      return;
    }
    const r = redactorLastRect;
    const ctx = canvas.getContext("2d");
    const cropped = ctx.getImageData(r.x, r.y, r.w, r.h);
    canvas.width = r.w;
    canvas.height = r.h;
    ctx.putImageData(cropped, 0, 0);
    redactorLastRect = null;
    redactorHistory = [];
  }

  function undoRedactor() {
    const canvas = document.getElementById("redactorCanvas");
    if (!canvas || !redactorHistory.length) return;
    const last = redactorHistory.pop();
    canvas.getContext("2d").putImageData(last, 0, 0);
  }

  // ---- Zouti pwofesyonèl: Zoom, Wotasyon, Filtè N&B/Kontras ----
  // N.B: fonksyon sa yo aji DIRÈKTEMAN sou kanva a nan DOM la, san yo pa
  // rele render() — sa evite nenpòt konfli ak pwoteksyon kanva a
  // (morphdom pa dwe janm "patch" yon kanva ki deja gen desen sou li).
  function redactorZoomIn() {
    redactorZoom = Math.min(3, redactorZoom + 0.25);
    const canvas = document.getElementById("redactorCanvas");
    if (canvas) canvas.style.transform = "scale(" + redactorZoom + ")";
  }

  function redactorZoomOut() {
    redactorZoom = Math.max(0.5, redactorZoom - 0.25);
    const canvas = document.getElementById("redactorCanvas");
    if (canvas) canvas.style.transform = "scale(" + redactorZoom + ")";
  }

  function redactorRotate() {
    const canvas = document.getElementById("redactorCanvas");
    if (!canvas) return;
    const w = canvas.width, h = canvas.height;
    if (!w || !h) return;
    const rotated = document.createElement("canvas");
    rotated.width = h; rotated.height = w;
    const rctx = rotated.getContext("2d");
    rctx.translate(h / 2, w / 2);
    rctx.rotate(Math.PI / 2);
    rctx.drawImage(canvas, -w / 2, -h / 2);
    canvas.width = h; canvas.height = w;
    canvas.getContext("2d").drawImage(rotated, 0, 0);
  }

  function toggleRedactorFilter() {
    redactorFilterOn = !redactorFilterOn;
    const canvas = document.getElementById("redactorCanvas");
    if (canvas) canvas.style.filter = redactorFilterOn ? "grayscale(1) contrast(1.6) brightness(1.1)" : "";
    const btn = document.getElementById("redactorFilterBtn");
    if (btn) {
      btn.style.background = redactorFilterOn ? "var(--gold)" : "rgba(255,255,255,0.12)";
      btn.style.color = redactorFilterOn ? "var(--navy)" : "#fff";
    }
  }

  function saveRedactorResult() {
    const canvas = document.getElementById("redactorCanvas");
    if (!canvas) return;
    canvas.toBlob(function (blob) {
      if (!blob) return;
      const file = new File([blob], "redacted.jpg", { type: "image/jpeg" });
      const cb = redactorOnSave;
      closeRedactor();
      if (cb) cb(file);
    }, "image/jpeg", 0.92);
  }

    if (tab === "jwenn" || tab === "match") return (item.city || "") + (item.created_at ? " \u00b7 " + formatPublishDate(item.created_at) : "");

      const statusLabel = item.status === "approved" ? "Apwouve \u2713" : item.status === "rejected" ? "Rejte" : "Ap tann verifikasyon";
      return statusLabel + (item.created_at ? " \u00b7 " + formatPublishDate(item.created_at) : "");

    return "";

    '</div>';

    if (profileDetailItem) {
      out += renderProfileDetail();
    } else {
      let tabsHeaderHtml = PROFILE_TAB_DEFS.map(function (t) {
        const count = profileCounts[t.key];
        return '<button class="profile-tab-btn' + (profileActiveTab === t.key ? " active" : "") + '" data-profile-tab="' + t.key + '">' +

        bodyHtml = '<div class="profile-tab-empty">Pa gen anyen isit la pou kounye a.</div>';

        bodyHtml = items.map(function (it, i) {

        '<div class="profile-tab-body">' + bodyHtml + '</div>' +

  async function insertAlertRow(extra) {
    if (await isUserBanned()) {
      alertError = "Kont ou bloke — kontakte sip\u00f2 si ou panse sa a se yon erè.";
      return false;
    }
    const payload = Object.assign({
      requester_uid: visitorId(),
      category: searchCategoryFilter || null,
      full_name: searchQuery || alertFullName || null,
    }, extra);
    try {
      const { error } = await supabaseClient.from("alerts").insert(payload);
      if (!error) return true;

      // Erè klasik Supabase: kachs schema a poko rafrechi apre yon ALTER TABLE.
      // Nou eseye ankò ak sèlman kolòn ki toujou garanti egziste yo (fallback).
      const msg = (error.message || "").toLowerCase();
      if (msg.indexOf("column") !== -1 && msg.indexOf("schema cache") !== -1) {
        const safePayload = {
          requester_uid: payload.requester_uid,
          full_name: payload.full_name,
        };
        const retry = await supabaseClient.from("alerts").insert(safePayload);
        if (!retry.error) return true;
      }

      alertError = "Nou pa t ka anrejistre al\u00e8t la: " + (error.message || "erè enkoni") + ". Tanpri eseye ank\u00f2 nan yon ti moman.";
      return false;
    } catch (e) {
      alertError = "Er\u00e8 koneksyon ak baz done a: " + (e.message || "");
      return false;
    }
  }

  // ---------- Kominote (community chat) ----------
  const COMMUNITY_EMOJIS = ["\ud83d\ude00", "\ud83d\ude02", "\u2764\ufe0f", "\ud83d\udc4d", "\ud83d\ude4f", "\ud83d\ude22", "\ud83d\ude2e", "\ud83c\udf89", "\ud83d\udd25", "\ud83d\ude0d", "\ud83d\ude4c", "\u2705"];

  function communitySenderLabel(msg) {
    return msg.sender_name && msg.sender_name.trim() ? msg.sender_name : "ITILIZAT\u00c8 ANONIM";
  }

  function communityFormatTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    let h = d.getHours(), m = String(d.getMinutes()).padStart(2, "0");
    const period = h < 12 ? "AM" : "PM";
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ":" + m + " " + period;
  }

  async function loadCommunityMessages() {
    communityLoading = true; render();
    try {
      const { data, error } = await supabaseClient
        .from("community_messages")
        .select("*")
        .order("created_at", { ascending: true })
        .limit(100);
      communityMessages = error ? [] : (data || []);
    } catch (e) { communityMessages = []; }
    communityLoading = false;
    render();
    scrollCommunityToBottom();
    localStorage.setItem("sekoupyes_last_seen_community_count", String(communityMessages.length));
    communityUnreadCount = 0;

    if (!communitySubscribed) {
      communitySubscribed = true;
      try {
        supabaseClient
          .channel("community_messages_channel")
          .on("postgres_changes", { event: "INSERT", schema: "public", table: "community_messages" }, function (payload) {
            communityMessages.push(payload.new);
            localStorage.setItem("sekoupyes_last_seen_community_count", String(communityMessages.length));
            render();
            scrollCommunityToBottom();
          })
          .subscribe();
      } catch (e) { /* Realtime pa konfigire — mesaj yo ap rafre\u0161i lè moun nan re-antre nan paj la */ }
    }
  }

  async function refreshCommunityUnreadCount() {
    try {
      const { count } = await supabaseClient.from("community_messages").select("*", { count: "exact", head: true });
      const lastSeen = parseInt(localStorage.getItem("sekoupyes_last_seen_community_count") || "0", 10);
      communityUnreadCount = Math.max(0, (count || 0) - lastSeen);
      render();
    } catch (e) { /* rete sou 0 */ }
  }

  function scrollCommunityToBottom() {
    setTimeout(function () {
      const el = document.getElementById("communityBodyScroll");
      if (el) el.scrollTop = el.scrollHeight;
    }, 30);
  }

  // Kenbe paj Kominote a byen kole ak klavye telefòn nan (san espas vid),
  // epi kenbe tèt paj la toujou vizib pandan moun nan ap tape.
  function setupCommunityViewportFix() {
    if (!window.visualViewport) return;
    function update() {
      const el = document.querySelector(".community-page");
      if (!el) return;
      el.style.height = window.visualViewport.height + "px";
      if (window.scrollY !== 0 || window.scrollX !== 0) window.scrollTo(0, 0);
      scrollCommunityToBottom();
    }
    window.visualViewport.addEventListener("resize", update);
    window.visualViewport.addEventListener("scroll", update);
  }

  async function sendCommunityMessage() {
    const text = communityInputValue.trim();
    if ((!text && !communityPendingImageFile) || communitySending) return;
    if (await isUserBanned()) {
      alert("Kont ou bloke — ou pa ka voye mesaj nan Kominote a.");
      return;
    }
    communitySending = true; render();

    let imageUrl = null;
    if (communityPendingImageFile) {
      const up = await uploadImageToStorage("community-photos", communityPendingImageFile);
      if (up.error) {
        communitySending = false; render();
        alert("Er\u00e8 pandan telechajman foto a: " + up.error);
        return;
      }
      imageUrl = up.url;
    }

    const senderName = (session && session.user && session.user.user_metadata && session.user.user_metadata.full_name) || null;
    const senderAvatar = (session && session.user && session.user.user_metadata && session.user.user_metadata.avatar_url) || null;
    const payload = {
      sender_uid: visitorId(),
      sender_name: senderName,
      sender_avatar: senderAvatar,
      content: communityCaptionValue.trim() || text || null,
      image_url: imageUrl,
    };

    try {
      const { error } = await supabaseClient.from("community_messages").insert(payload);
      if (error) throw error;
    } catch (e) {
      const msg = ((e && e.message) || "").toLowerCase();
      if (msg.indexOf("column") !== -1 && msg.indexOf("schema cache") !== -1) {
        // Eseye ankò san sender_avatar/sender_name si se kolòn sa yo ki manke
        try {
          const safePayload = { sender_uid: payload.sender_uid, content: payload.content, image_url: payload.image_url };
          const retry = await supabaseClient.from("community_messages").insert(safePayload);
          if (!retry.error) {
            communityInputValue = ""; communityCaptionValue = ""; communityPendingImageFile = null;
            communityPendingImagePreview = ""; communitySending = false;
            render(); scrollCommunityToBottom();
            return;
          }
        } catch (e2) { /* tonbe sou mesaj erè anba a */ }
      }
      alert("Pa t ka voye mesaj la: " + ((e && e.message) || "erè enkoni") + "\n\nVerifye ke tab \"community_messages\" gen kolòn sender_avatar (gade SQL ki nan repons Claude a).");
      communitySending = false; render();
      return;
    }

    communityInputValue = "";
    communityCaptionValue = "";
    communityPendingImageFile = null;
    communityPendingImagePreview = "";
    communitySending = false;
    render();
    scrollCommunityToBottom();
  }

  function renderHeader(header) {
    let inner = "";

    else if (header.type === "icon" && header.icon) inner += '<div class="icon-box">' + icon(header.icon, "var(--gold)") + '</div>';
    if (header.title) inner += '<h2 class="header-title">' + header.title + '</h2>';
    if (header.subtitle) inner += '<p class="header-subtitle">' + header.subtitle + '</p>';
    if (header.badge) inner += '<div class="badge">' + icon(header.badgeIcon || "zap", "var(--gold-light)") + '<span>' + header.badge + '</span></div>';
    return '<div class="card-header">' + inner + '</div>';
  }

  function renderBody(body) {
    let inner = "";
    if (body.title) inner += '<h2 class="body-title">' + body.title + '</h2>';
    if (body.guideLabel) inner += '<p style="font-size:12px;font-weight:700;color:var(--gold);text-align:center;margin:0 0 12px;letter-spacing:0.02em;">' + body.guideLabel + '</p>';
    if (body.description) inner += '<p class="body-description">' + body.description + '</p>';
    if (body.intro) inner += '<p class="body-intro">' + body.intro + '</p>';
    if (body.optionsTitle) inner += '<p style="text-align:center;font-weight:700;color:var(--gold);font-size:14px;margin:10px 0 8px;">' + body.optionsTitle + '</p>';
    if (body.options) {
      inner += '<ul class="options-list">';
      body.options.forEach(function (opt) { inner += '<li><span class="opt-label">' + opt.label + '</span> ' + opt.text + '</li>'; });
      inner += '</ul>';
    }
    if (body.steps) {
      inner += '<ul class="steps-list">';
      body.steps.forEach(function (s) { inner += '<li>' + s + '</li>'; });
      inner += '</ul>';
    }
    if (body.cards) {
      inner += '<div class="cards-grid">';
      body.cards.forEach(function (c) {
        inner += '<div class="info-card"><h4>' + c.title + '</h4><ul>';
        c.items.forEach(function (it) { inner += '<li>' + it + '</li>'; });
        inner += '</ul></div>';
      });
      inner += '</div>';
    }
    if (body.disclaimer) inner += '<div class="disclaimer-box">' + icon("info", "var(--gold-light)") + ' &nbsp;' + body.disclaimer + '</div>';
    return inner;
  }

  function renderOnboarding() {
    const slide = SLIDES[step];
    const isFirst = step === 0;
    const isLast = step === SLIDES.length - 1;
    let dots = "";
    SLIDES.forEach(function (_, i) { dots += '<div class="dot' + (i === step ? ' active' : '') + '"></div>'; });
    let buttons = '<div class="btn-row">';
    if (!isFirst) buttons += '<button class="btn btn-back" id="btnBack">' + icon("chevronLeft", "var(--navy)") + ' Retou</button>';
    buttons += '<button class="btn btn-primary ' + (isFirst ? "gold" : "navy") + '" id="btnNext">' +
      (isLast ? "K\u00f2manse!" : "Swivan") +
      (isLast ? "" : icon("chevronRight", isFirst ? "var(--navy)" : "var(--paper)")) +
      '</button>';
    buttons += '</div>';
    return '<div class="overlay"><div class="card">' +
      '<button class="close-btn" id="btnClose">' + ICONS.x + '</button>' +
      renderHeader(slide.header) +
      '<div class="card-body">' + renderBody(slide.body) +
      '<div class="dots">' + dots + '</div>' +
      buttons +
      '<button class="skip-link" id="btnSkip">Pase \u2014 sote gid la</button>' +
      '</div></div></div>';
  }

  async function sendChatMessage() {
    const text = chatInputValue.trim();
    if ((!text && !chatPendingImageFile) || chatSending) return;

    let imageUrl = null;
    if (chatPendingImageFile) {
      chatSending = true; render();
      const up = await uploadImageToStorage("community-photos", chatPendingImageFile);
      if (up.error) {
        chatSending = false; render();
        alert("Er\u00e8 pandan telechajman foto a: " + up.error);
        return;
      }
      imageUrl = up.url;
    }

    chatMessages.push({ role: "user", content: text || null, image_url: imageUrl });
    chatInputValue = "";
    chatPendingImageFile = null;
    chatPendingImagePreview = "";
    chatSending = true;
    render();
    scrollChatToBottom();
    logChatMessage("user", text || (imageUrl ? "[imaj]" : ""));

    try {
      const res = await fetch("/api/chat-claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ context: "support", messages: chatMessages.map(function (m) { return { role: m.role, content: m.content, image_url: m.image_url || undefined }; }) }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erè sèvè.");
      chatMessages.push({ role: "assistant", content: data.reply || "Padon, mwen pa t konprann." });
      logChatMessage("assistant", data.reply || "");
      aiStatus = "ok";
    } catch (e) {
      chatMessages.push({ role: "assistant", content: "Padon, gen yon pwoblèm koneksyon ak sèvis chat la kounye a. Tanpri eseye ankò, oswa kontakte sip\u00f2 sou WhatsApp." });
      aiStatus = "error";
    }

  async function sendMaintChatMessage() {
    const text = maintChatInputValue.trim();
    if ((!text && !maintChatPendingImageFile) || maintChatSending) return;

    let imageUrl = null;
    if (maintChatPendingImageFile) {
      maintChatSending = true; render();
      const up = await uploadImageToStorage("community-photos", maintChatPendingImageFile);
      if (up.error) {
        maintChatSending = false; render();
        alert("Er\u00e8 pandan telechajman foto a: " + up.error);
        return;
      }
      imageUrl = up.url;
    }

    maintChatMessages.push({ role: "user", content: text || null, image_url: imageUrl });
    maintChatInputValue = "";
    maintChatPendingImageFile = null;
    maintChatPendingImagePreview = "";
    maintChatSending = true;
    render();

    try {
      const res = await fetch("/api/chat-claude", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ context: "maintenance", messages: maintChatMessages.map(function (m) { return { role: m.role, content: m.content, image_url: m.image_url || undefined }; }) }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Erè sèvè.");
      maintChatMessages.push({ role: "assistant", content: data.reply || "Padon, mwen pa t konprann." });
    } catch (e) {
      maintChatMessages.push({ role: "assistant", content: "Er\u00e8 koneksyon ak chat Claude a: " + e.message + " \u2014 verifye ke ANTHROPIC_API_KEY konfigire byen sou Vercel, epi ke gen kredi sou kont lan." });

    // Kenbe pozisyon defileman orizontal bwat ki gen "overflow-x" (egzanp: tab
