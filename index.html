<!doctype html>
<html lang="ht" translate="no" class="notranslate">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="google" content="notranslate">
<meta name="robots" content="notranslate">
<title>SekouPyès</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #16233F;
    --navy-light: #223259;
    --gold: #C79A3C;
    --gold-light: #E8C77A;
    --paper: #FAF7F1;
    --paper-2: #F1ECE1;
    --liy: #E4DCC8;
    --text-gray: #5B5A54;
    --dark: #1C1B18;
    --green: #2F6F4B;
    --red: #B33A3A;
    --app-blue: #3B82F6;
    --wa-green: #25D366;
    --fb-blue: #1877F2;
    --x-black: #0A0A0A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; touch-action: pan-y; overscroll-behavior-y: contain; }
  body { font-family: 'Inter', sans-serif; background: var(--paper); overflow-x: hidden; }
  #app { position: relative; width: 100%; min-height: 100vh; }
  .hidden { display: none !important; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Top navbar ---------- */
  .top-navbar {
    position: sticky; top: 0; z-index: 25;
    background: var(--navy);
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .navbar-left { display: flex; align-items: center; gap: 10px; }
  .hamburger-btn {
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
    width: 22px; background: none; border: none; cursor: pointer; padding: 4px 0;
  }
  .hamburger-btn span { display: block; height: 2px; width: 100%; background: var(--paper); border-radius: 2px; }
  .navbar-logo { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  .navbar-text { display: flex; flex-direction: column; gap: 1px; }
  .navbar-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15.5px; color: var(--paper); display: flex; align-items: center; gap: 5px; line-height: 1.15; }
  .navbar-subtitle { font-size: 9.5px; font-weight: 600; letter-spacing: 0.02em; color: var(--paper); }
  .navbar-subtitle .word { color: var(--gold-light); }
  .navbar-status { display: flex; align-items: center; gap: 4px; font-size: 8.5px; font-weight: 700; letter-spacing: 0.03em; color: var(--paper); margin-top: 1px; }
  .navbar-status.ceo { color: var(--gold-light); }
  .pulse-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; animation: pulseDot 1.6s ease-out infinite; }
  .pulse-dot.green { background: var(--green); }
  .pulse-dot.red { background: var(--red); }
  @keyframes pulseDot {
    0% { box-shadow: 0 0 0 0 rgba(0,0,0,0.4); }
    70% { box-shadow: 0 0 0 6px rgba(0,0,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  }
  .navbar-right { display: flex; align-items: center; }
  .profile-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(232,199,122,0.4);
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-light); cursor: pointer; overflow: hidden; padding: 0;
  }
  .profile-btn img { width: 100%; height: 100%; object-fit: cover; }
  .connect-btn {
    padding: 8px 16px; border-radius: 20px; border: 1.5px solid var(--gold-light);
    background: transparent; color: var(--gold-light); font-size: 12.5px; font-weight: 700;
    cursor: pointer; font-family: 'Inter', sans-serif;
  }

  /* ---------- Sidebar (half-screen) ---------- */
  .sidebar-overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(22,35,63,0.15);
    display: none;
  }
  .sidebar-overlay.open { display: block; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0; width: 50%;
    max-width: 280px;
    background: var(--navy);
    z-index: 61;
    transform: translateX(-100%);
    transition: transform 0.28s ease;
    padding: 20px 16px;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: 4px 0 24px rgba(0,0,0,0.3);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar-close {
    align-self: flex-end; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(255,255,255,0.1); border: none; color: var(--paper);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    margin-bottom: 10px;
  }
  .sidebar-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 10px; border-radius: 10px; border: none; background: none;
    color: var(--paper); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; text-align: left;
  }
  .sidebar-item:hover { background: rgba(255,255,255,0.06); }

  /* ---------- Home hero ---------- */
  .home { padding-bottom: 110px; }
  .home-inner { max-width: 560px; margin: 0 auto; }
  .home-header { background: linear-gradient(160deg, var(--navy) 0%, var(--navy-light) 100%); padding: 24px 20px 36px; text-align: left; }
  .top-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.1); color: var(--paper); font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 20px; margin-bottom: 18px; }
  .cert-badge { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; color: var(--navy); }
  .cert-badge.gold { background: var(--gold); }
  .cert-badge.blue { background: var(--app-blue); color: #fff; }
  .hero-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 28px; margin: 0 0 12px; line-height: 1.25; }
  .hero-title .line-white { color: var(--paper); display: block; }
  .hero-title .line-gold { color: var(--gold-light); display: block; }
  .hero-desc { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.6; color: var(--paper); opacity: 0.92; max-width: 380px; margin: 0 0 18px; }
  .cta-hint { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--gold-light); margin: 0 0 12px; text-align: center; }
  .cta-row { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 380px; margin: 0 auto; }
  .cta-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 15px 10px; border-radius: 14px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; border: none; cursor: pointer; text-align: center; }
  .cta-btn.lost { background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 100%); color: var(--navy); box-shadow: 0 6px 16px rgba(199,154,60,0.35); }
  .cta-btn.found { background: rgba(255,255,255,0.1); color: var(--paper); border: 1.5px solid rgba(232,199,122,0.5); }

  .section { padding: 26px 20px 4px; }
  .section-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px; color: var(--navy); margin: 0 0 14px; }

  .stats-row { display: flex; gap: 10px; padding: 20px 20px 0; }
  .stat-card { flex: 1; background: var(--paper-2); border: 1px solid var(--liy); border-radius: 14px; padding: 14px 8px; text-align: center; }
  .stat-value { font-family: 'Fraunces', serif; font-weight: 700; font-size: 20px; color: var(--navy); }
  .stat-label { font-size: 10.5px; color: var(--text-gray); margin-top: 4px; line-height: 1.3; }

  .doc-badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .doc-badge {
    display: flex; align-items: center; gap: 6px;
    background: var(--paper); border: 1px solid var(--liy); border-radius: 20px;
    padding: 8px 14px; font-size: 12.5px; color: var(--navy); font-weight: 500;
    cursor: pointer;
  }
  .doc-badge:active { background: var(--paper-2); }

  .empty-state { background: var(--paper-2); border: 1px dashed var(--liy); border-radius: 14px; padding: 26px 18px; text-align: center; color: var(--text-gray); font-size: 13.5px; line-height: 1.6; }
  .empty-state a { display: block; margin-top: 8px; color: var(--gold); font-weight: 600; text-decoration: none; }

  .piece-card { background: var(--paper); border: 1px solid var(--liy); border-radius: 14px; padding: 14px; display: flex; gap: 12px; align-items: center; }
  .piece-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--paper-2); display: flex; align-items: center; justify-content: center; color: var(--gold); flex-shrink: 0; }
  .piece-info { flex: 1; min-width: 0; }
  .piece-cat { font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; color: var(--navy); }
  .piece-name { font-size: 12px; color: var(--text-gray); margin-top: 2px; }
  .see-more-note { text-align: center; margin-top: 10px; font-size: 12.5px; color: var(--gold); font-weight: 600; cursor: pointer; text-decoration: underline; }

  .accordion-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; background: var(--paper-2); border: 1px solid var(--liy); border-radius: 14px; padding: 14px 16px; cursor: pointer; }
  .accordion-toggle-label-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .accordion-toggle-label { display: flex; align-items: center; gap: 10px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 15px; color: var(--navy); }
  .accordion-toggle-sub { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--gold); }
  .accordion-chevron { transition: transform 0.25s ease; color: var(--gold); }
  .accordion-chevron.open { transform: rotate(180deg); }
  .accordion-panel { overflow: hidden; max-height: 0; transition: max-height 0.3s ease; }
  .accordion-panel.open { max-height: 900px; }
  .accordion-inner { background: var(--paper); border: 1px solid var(--liy); border-top: none; border-radius: 0 0 14px 14px; padding: 16px; margin-top: -1px; }
  .accordion-steps { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .accordion-steps li { font-size: 13.5px; color: var(--navy); line-height: 1.5; }
  .accordion-note { font-size: 13px; color: var(--navy); line-height: 1.6; margin: 0 0 10px; }
  .accordion-options { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .accordion-options li { font-size: 13px; color: var(--navy); line-height: 1.5; }
  .accordion-options .opt-label { font-weight: 700; color: var(--gold); }
  .accordion-close-btn { width: 100%; padding: 12px 0; border-radius: 12px; border: none; background: var(--navy); color: var(--paper); font-family: 'Fraunces', serif; font-weight: 600; font-size: 14.5px; cursor: pointer; }

  .share-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .share-btn {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 12px; border: none;
    font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; color: #fff;
  }
  .share-btn.wa { background: var(--wa-green); }
  .share-btn.fb { background: var(--fb-blue); }
  .share-btn.x { background: var(--x-black); }
  .share-btn.ig { background: linear-gradient(45deg, #F58529, #DD2A7B, #8134AF, #515BD4); }

  .ad-banner { margin: 8px 20px 0; border-radius: 12px; border: 1px dashed var(--liy); background: var(--paper-2); padding: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 64px; color: var(--text-gray); font-size: 12px; text-align: center; }

  .site-footer { text-align: center; padding: 18px 20px 4px; }
  .footer-copyright { font-size: 11.5px; color: var(--text-gray); margin-bottom: 8px; }
  .footer-meta { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; color: var(--text-gray); opacity: 0.8; }
  .footer-id-row { display: flex; align-items: center; gap: 6px; }
  .copy-icon-btn { background: none; border: none; color: var(--gold); cursor: pointer; display: flex; align-items: center; padding: 2px; }
  .copy-toast {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    background: var(--navy); color: var(--paper); font-size: 12.5px; padding: 8px 16px;
    border-radius: 20px; z-index: 80; opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
  }
  .copy-toast.show { opacity: 1; }

  /* ---------- Generic page (search/publish/account/login) ---------- */
  .page { max-width: 560px; margin: 0 auto; padding: 20px 20px 110px; }
  .page-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 20px; color: var(--navy); margin: 0 0 16px; }
  .field-label { font-size: 12.5px; font-weight: 700; color: var(--navy); margin: 14px 0 6px; display: block; }
  .field-input, .field-select, .field-textarea {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--liy);
    background: var(--paper); font-family: 'Inter', sans-serif; font-size: 14px; color: var(--navy);
  }
  .field-textarea { resize: vertical; min-height: 80px; }
  .input-icon-wrap { position: relative; }
  .input-icon-wrap .field-input { padding-left: 38px; }
  .input-icon-wrap.has-right .field-input { padding-right: 38px; }
  .input-icon-left { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-gray); display: flex; pointer-events: none; }
  .input-icon-right { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--text-gray); background: none; border: none; cursor: pointer; display: flex; padding: 4px; }
  .checkbox-row-line { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .remember-me { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--navy); cursor: pointer; }
  .remember-me input { width: 15px; height: 15px; accent-color: var(--gold); cursor: pointer; }
  .forgot-link { font-size: 12.5px; color: var(--gold); font-weight: 600; background: none; border: none; cursor: pointer; text-decoration: underline; }
  .sex-radio-row { display: flex; gap: 16px; margin-top: 8px; }
  .sex-radio { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--navy); cursor: pointer; }
  .sex-radio input { width: 15px; height: 15px; accent-color: var(--gold); cursor: pointer; }
  .success-banner { background: rgba(47,111,75,0.08); border: 1px solid rgba(47,111,75,0.25); color: var(--green); border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-bottom: 12px; }
  .forgot-modal-overlay { position: fixed; inset: 0; background: rgba(22,35,63,0.45); z-index: 70; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .forgot-modal { width: 100%; max-width: 380px; background: var(--paper); border-radius: 20px; padding: 22px; max-height: 88vh; overflow-y: auto; }
  .forgot-modal-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; color: var(--navy); margin: 0 0 6px; }
  .forgot-modal-desc { font-size: 12.5px; color: var(--text-gray); margin: 0 0 14px; line-height: 1.5; }
  .forgot-step-dots { display: flex; gap: 6px; margin-bottom: 16px; }
  .forgot-step-dots span { flex: 1; height: 4px; border-radius: 2px; background: var(--liy); }
  .forgot-step-dots span.done { background: var(--gold); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip { padding: 7px 13px; border-radius: 20px; border: 1px solid var(--liy); background: var(--paper); font-size: 12.5px; color: var(--navy); cursor: pointer; }
  .chip.active { background: var(--navy); color: var(--paper); border-color: var(--navy); }
  .primary-btn {
    width: 100%; margin-top: 20px; padding: 15px 0; border-radius: 14px; border: none;
    background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 100%); color: var(--navy);
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 15.5px; cursor: pointer;
  }
  .secondary-btn {
    width: 100%; margin-top: 10px; padding: 13px 0; border-radius: 14px; border: 1px solid var(--liy);
    background: var(--paper); color: var(--navy); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; cursor: pointer;
  }
  .back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--navy); font-size: 13px; font-weight: 600; background: none; border: none; cursor: pointer; margin-bottom: 10px; }
  .result-list { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .google-btn {
    width: 100%; margin-top: 14px; padding: 13px 0; border-radius: 14px; border: 1px solid var(--liy);
    background: #fff; color: var(--navy); font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .divider-or { text-align: center; font-size: 12px; color: var(--text-gray); margin: 16px 0; position: relative; }
  .status-banner { border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-bottom: 12px; }
  .status-banner.demo { background: rgba(179,58,58,0.08); border: 1px solid rgba(179,58,58,0.25); color: var(--red); }
  .status-banner.connected { background: rgba(47,111,75,0.08); border: 1px solid rgba(47,111,75,0.25); color: var(--green); }
  .account-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; margin: 0 auto 12px; display: block; background: var(--paper-2); }

  /* ---------- Bottom nav ---------- */
  .bottom-nav {
    position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom));
    background: var(--paper); border-radius: 20px; box-shadow: 0 10px 30px rgba(22,35,63,0.25);
    display: flex; align-items: center; padding: 10px 6px; z-index: 15;
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    background: none; border: none; cursor: pointer; color: var(--text-gray); font-size: 11px;
    font-family: 'Inter', sans-serif; text-align: center; padding: 4px 0;
  }
  .nav-item.active { color: var(--navy); font-weight: 600; }
  .nav-item.active svg { stroke: var(--navy); }

  .chat-fab {
    position: fixed; right: 20px; bottom: 92px; width: 50px; height: 50px; border-radius: 50%;
    background: var(--app-blue); box-shadow: 0 8px 20px rgba(59,130,246,0.45);
    display: flex; align-items: center; justify-content: center; color: #fff; border: none;
    cursor: pointer; z-index: 16;
  }
  .chat-panel {
    position: fixed; right: 16px; bottom: 150px; left: 16px; max-width: 360px; margin-left: auto;
    background: var(--paper); border-radius: 18px; box-shadow: 0 20px 50px rgba(22,35,63,0.3);
    z-index: 40; display: none; flex-direction: column; overflow: hidden; max-height: 60vh;
  }
  .chat-panel.open { display: flex; }
  .chat-header { background: var(--navy); color: var(--paper); padding: 12px 16px; font-family: 'Fraunces', serif; font-weight: 600; font-size: 14.5px; display: flex; justify-content: space-between; align-items: center; }
  .chat-header button { background: none; border: none; color: var(--paper); cursor: pointer; }
  .chat-body { flex: 1; padding: 14px; overflow-y: auto; font-size: 13px; color: var(--text-gray); }
  .chat-input-row { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--liy); }
  .chat-input-row input { flex: 1; border: 1px solid var(--liy); border-radius: 20px; padding: 10px 14px; font-size: 13px; font-family: 'Inter', sans-serif; }
  .chat-input-row button { background: var(--app-blue); color: #fff; border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }

  /* ---------- Onboarding modal ---------- */
  .overlay { position: fixed; inset: 0; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); background: rgba(22, 35, 63, 0.35); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .card { position: relative; width: 100%; max-width: 400px; border-radius: 24px; overflow: hidden; box-shadow: 0 24px 60px rgba(22,35,63,0.35); background: var(--paper); max-height: 92vh; display: flex; flex-direction: column; }
  .close-btn { position: absolute; top: 16px; right: 16px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; border: none; background: rgba(255,255,255,0.15); color: var(--paper); display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .card-header { background: linear-gradient(160deg, var(--navy) 0%, var(--navy-light) 100%); padding: 36px 24px 26px; display: flex; flex-direction: column; align-items: center; text-align: center; flex-shrink: 0; }
  .logo-img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; box-shadow: 0 8px 24px rgba(0,0,0,0.35); margin-bottom: 18px; }
  .icon-box { width: 60px; height: 60px; border-radius: 16px; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .header-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 23px; color: var(--gold-light); margin: 0 0 10px; line-height: 1.25; }
  .header-subtitle { font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.6; color: var(--gold-light); opacity: 0.92; margin: 0 0 16px; max-width: 300px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.12); color: var(--paper); font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 500; padding: 7px 15px; border-radius: 20px; }
  .card-body { background: var(--paper); padding: 24px 22px 20px; text-align: center; overflow-y: auto; }
  .body-title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; color: var(--navy); margin: 0 0 12px; line-height: 1.25; }
  .body-description { font-family: 'Inter', sans-serif; font-size: 14.5px; line-height: 1.6; color: var(--navy); margin: 0 0 18px; white-space: pre-line; }
  .body-intro { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.6; color: var(--navy); margin: 0 0 14px; text-align: left; }
  .options-list, .steps-list { list-style: none; margin: 0 0 18px; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 10px; }
  .options-list li, .steps-list li { font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.5; color: var(--navy); }
  .options-list .opt-label { font-weight: 700; color: var(--gold); }
  .cards-grid { display: flex; flex-direction: column; gap: 12px; margin: 0 0 16px; text-align: left; }
  .info-card { background: var(--paper-2); border: 1px solid var(--liy); border-radius: 14px; padding: 14px 16px; }
  .info-card h4 { font-family: 'Fraunces', serif; font-size: 15px; color: var(--navy); margin: 0 0 8px; }
  .info-card ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 6px; }
  .info-card li { font-family: 'Inter', sans-serif; font-size: 12.5px; line-height: 1.45; color: var(--text-gray); }
  .disclaimer-box { background: var(--navy); color: var(--paper); border-radius: 12px; padding: 12px 14px; font-family: 'Inter', sans-serif; font-size: 12px; line-height: 1.5; margin: 0 0 18px; text-align: left; }
  .dots { display: flex; justify-content: center; gap: 8px; margin-bottom: 18px; }
  .dot { height: 8px; border-radius: 4px; background: var(--liy); transition: all 0.25s ease; }
  .dot.active { width: 22px; background: var(--navy); }
  .dot:not(.active) { width: 8px; }
  .btn-row { display: flex; gap: 10px; }
  .btn { font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px; border-radius: 14px; border: none; cursor: pointer; padding: 15px 0; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .btn-back { flex: 0 0 auto; padding: 15px 16px; background: var(--paper); color: var(--navy); border: 1px solid var(--liy); font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14.5px; }
  .btn-primary { flex: 1; }
  .btn-primary.gold { background: linear-gradient(160deg, var(--gold-light) 0%, var(--gold) 100%); color: var(--navy); box-shadow: 0 6px 16px rgba(199,154,60,0.35); }
  .btn-primary.navy { background: var(--navy); color: var(--paper); }
  .skip-link { display: block; margin: 14px auto 0; background: none; border: none; color: var(--gold); font-size: 12.5px; font-weight: 500; text-decoration: underline; cursor: pointer; }
  .reopen-btn { position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 10px; border: 1px solid var(--navy); background: var(--paper); color: var(--navy); font-family: 'Inter', sans-serif; font-size: 12px; cursor: pointer; z-index: 20; }

  // ---------- Supabase data helpers ----------
  async function refreshPieces() {
    try {
      const { data, count, error } = await supabaseClient
        .from("pieces")
        .select("*", { count: "exact" })
        .order("created_at", { ascending: false })
        .limit(1);
      if (!error) {
        latestPiece = (data && data[0]) || null;
        piecesCount = count || 0;
      }
    } catch (e) { /* table pa ekziste ankò, oswa pa gen koneksyon — sa OK pou demo */ }
    render();
  }

  async function publishPiece(payload) {
    try {
      const { error } = await supabaseClient.from("pieces").insert(payload);
      if (error) { alert("Erè pandan piblikasyon an: " + error.message); return false; }
      await refreshPieces();
      return true;
    } catch (e) {
      alert("Erè koneksyon ak baz done a.");
      return false;
    }
  }

  async function runSearch(query, category) {
    searchLoading = true; render();
    try {
      let q = supabaseClient.from("pieces").select("*").order("created_at", { ascending: false }).limit(20);
      if (category) q = q.eq("category", category);
      if (query) q = q.ilike("full_name", "%" + query + "%");
      const { data, error } = await q;
      searchResults = error ? [] : (data || []);
    } catch (e) { searchResults = []; }
    searchLoading = false; render();
  }

  // ---------- Auth ----------
  supabaseClient.auth.onAuthStateChange(function (_event, newSession) {
    session = newSession;
    render();
  });
  {
    const rememberedEmail = localStorage.getItem("sekoupyes_remember_email");
    if (rememberedEmail) { authEmail = rememberedEmail; rememberMe = true; }
  }
  supabaseClient.auth.getSession().then(function (res) {
    session = res.data.session;
    render();
  });

  async function handleSignIn() {
    authError = "";
    if (!authEmail || !authPassword) { authError = "Tanpri antre imèl ak modpas."; render(); return; }
    const res = await supabaseClient.auth.signInWithPassword({ email: authEmail, password: authPassword });
    if (res.error) { authError = res.error.message; render(); return; }
    if (rememberMe) localStorage.setItem("sekoupyes_remember_email", authEmail);
    else localStorage.removeItem("sekoupyes_remember_email");
    authPassword = "";
    currentView = "home";
    render();
  }

  async function handleSignUp() {
    authError = "";
    if (!signupFullName || !authEmail || !authPassword || !signupConfirmPassword || !signupSex || !signupPhone) {
      authError = "Tanpri ranpli tout enf\u00f2masyon yo.";
      render(); return;
    }
    if (authPassword !== signupConfirmPassword) {
      authError = "Modpas yo pa matche.";
      render(); return;
    }
    if (authPassword.length < 6) {
      authError = "Modpas la dwe gen omwen 6 karakt\u00e8.";
      render(); return;
    }
    const res = await supabaseClient.auth.signUp({
      email: authEmail,
      password: authPassword,
      options: { data: { full_name: signupFullName, sex: signupSex, phone: signupPhone } },
    });
    if (res.error) { authError = res.error.message; render(); return; }

    // Pa konekte otomatikman — voye moun nan tounen sou paj Konekte ak yon mesaj siks\u00e8.
    await supabaseClient.auth.signOut();
    authMode = "signin";
    authSuccess = "Kont ou kreye avè\u00e8k siks\u00e8! Konekte ak imèl ak modpas ou fèk kreye a.";
    authPassword = "";
    signupConfirmPassword = "";
    signupFullName = ""; signupSex = ""; signupPhone = "";
    render();
  }

  async function handleGoogleAuth() {
    await supabaseClient.auth.signInWithOAuth({ provider: "google", options: { redirectTo: window.location.href } });
  }

  async function handleSignOut() {
    await supabaseClient.auth.signOut();
    currentView = "home";
    render();
  }

  // ---------- Forgot password (OTP via Supabase) ----------
  function openForgotPassword() {
    forgotOpen = true;
    forgotStep = 1;
    forgotEmail = authEmail || "";
    forgotOtp = "";
    forgotNewPassword = "";
    forgotConfirmPassword = "";
    forgotError = "";
    render();
  }

  function closeForgotPassword() {
    forgotOpen = false;
    render();
  }

  async function submitForgotEmail() {
    forgotError = "";
    if (!forgotEmail) { forgotError = "Tanpri antre yon imèl."; render(); return; }
    forgotLoading = true; render();
    const res = await supabaseClient.auth.resetPasswordForEmail(forgotEmail);
    forgotLoading = false;
    if (res.error) { forgotError = res.error.message; render(); return; }
    forgotStep = 2;
    render();
  }

  async function submitForgotOtp() {
    forgotError = "";
    if (!forgotOtp) { forgotError = "Tanpri antre k\u00f2d la."; render(); return; }
    forgotLoading = true; render();
    const res = await supabaseClient.auth.verifyOtp({ email: forgotEmail, token: forgotOtp, type: "recovery" });
    forgotLoading = false;
    if (res.error) { forgotError = res.error.message; render(); return; }
    forgotStep = 3;
    render();
  }

  async function submitNewPassword() {
    forgotError = "";
    if (!forgotNewPassword || !forgotConfirmPassword) { forgotError = "Tanpri ranpli tout de bwat yo."; render(); return; }
    if (forgotNewPassword !== forgotConfirmPassword) { forgotError = "Modpas yo pa matche."; render(); return; }
    if (forgotNewPassword.length < 6) { forgotError = "Modpas la dwe gen omwen 6 karakt\u00e8."; render(); return; }
    forgotLoading = true; render();
    const res = await supabaseClient.auth.updateUser({ password: forgotNewPassword });
    forgotLoading = false;
    if (res.error) { forgotError = res.error.message; render(); return; }
    await supabaseClient.auth.signOut();
    forgotOpen = false;
    authMode = "signin";
    authEmail = forgotEmail;
    authSuccess = "Modpas ou chanje avèk siksè! Konekte ak nouvo modpas ou a.";
    render();
  }

        (forgotError ? '<div style="color:var(--red);font-size:12.5px;margin-bottom:8px;">' + forgotError + '</div>' : '') +
        '<span class="field-label">K\u00f2d Konfimasyon (OTP)</span>' +
        '<input class="field-input" id="forgotOtpInput" type="text" inputmode="numeric" value="' + forgotOtp + '" placeholder="123456" />' +
        '<button class="primary-btn" id="forgotSubmitOtpBtn"' + (forgotLoading ? " disabled" : "") + '>' + (forgotLoading ? "Ap verifye..." : "Konfime K\u00f2d la") + '</button>' +
        '<button class="secondary-btn" id="forgotCancelBtn">Anile</button>';
    } else {
      inner = '<div class="forgot-modal-title">Nouvo Modpas</div>' +
        '<div class="forgot-modal-desc">Mete nouvo modpas ou.</div>' + dots +
        (forgotError ? '<div style="color:var(--red);font-size:12.5px;margin-bottom:8px;">' + forgotError + '</div>' : '') +
        '<span class="field-label">Nouvo Modpas</span>' +
        '<input class="field-input" id="forgotNewPwInput" type="password" value="' + forgotNewPassword + '" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" />' +
        '<span class="field-label">Konfime Nouvo Modpas</span>' +
        '<input class="field-input" id="forgotConfirmPwInput" type="password" value="' + forgotConfirmPassword + '" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" />' +
        '<button class="primary-btn" id="forgotSubmitNewPwBtn"' + (forgotLoading ? " disabled" : "") + '>' + (forgotLoading ? "Ap anrejistre..." : "Anrejistre Nouvo Modpas") + '</button>' +
        '<button class="secondary-btn" id="forgotCancelBtn">Anile</button>';
    }

    return '<div class="forgot-modal-overlay" id="forgotModalOverlay"><div class="forgot-modal">' + inner + '</div></div>';
  }


  // ---------- Security & Privacy page ----------
  function renderSecurityPage() {
    return '<div class="page">' +
      '<button class="back-link" id="backFromSecurity">' + icon("chevronLeft", "var(--navy)", 16) + ' Ak\u00e8y</button>' +
      '<div class="page-title">Sekirite &amp; Konfidansyalite</div>' +
      '<div class="cards-grid" style="margin-top:4px;">' +
        '<div class="info-card"><h4>Sekirite &amp; Konfidansyalite</h4><ul>' +
          '<li>Enf\u00f2masyon p\u00e8sonèl yo pa divilge, nimewo py\u00e8s yo kache 100% (Done yo efase otomatikman 24h apre ou jwenn py\u00e8s la).</li>' +
          '<li>Rankont pou remiz py\u00e8s la dwe f\u00e8t s\u00e8lman nan yon kote piblik (Devan komisarya, plas piblik, elatriye).</li>' +
          '<li>Toujou mande moun nan enf\u00f2masyon ki sou py\u00e8s la anvan ou rem\u00e8t li.</li>' +
          '<li>Pa bay py\u00e8s pou okenn l\u00f2t moun si se pa m\u00e8t li ki vin rekipere l.</li>' +
        '</ul></div>' +
        '<div class="info-card"><h4>Rekonpans &amp; P\u00e8man</h4><ul>' +
          '<li>Moun ki jwenn py\u00e8s la rekonpanse s\u00e8lman lè m\u00e8t la KONFIME li resevwa py\u00e8s li.</li>' +
          '<li>P\u00e8man an se s\u00e8lman yon rekonpans (SekouPy\u00e8s pa vann dokiman Leta).</li>' +
          '<li>P\u00e8man an rete nan yon kont 100% sekirize (Ranbousman garanti si pa gen echanj).</li>' +
        '</ul></div>' +
        '<div class="info-card"><h4>Fwod ak Sanksyon</h4><ul>' +
          '<li>Zewo tol\u00e9rans pou fo rapò ak magouy.</li>' +
          '<li>Fo kont yo ap bloke imedyatman epi rapòte bay lajistis.</li>' +
          '<li>Kontakte sip\u00f2 sist\u00e8m nan pou tout aksyon enkonpri.</li>' +
        '</ul></div>' +
        '<div class="info-card"><h4>Gid Itilizasyon</h4><ul>' +
          '<li>Etap 1: Pran yon foto oswa Skane py\u00e8s idantite ou jwenn nan.</li>' +
          '<li>Etap 2: Ranpli enf\u00f2masyon ki mande yo.</li>' +
          '<li>Etap 3: Pibliye py\u00e8s idantite a.</li>' +
          '<li>Etap 4: Tann Pwopriyet\u00e8 li kontakte w\u2019.</li>' +
        '</ul></div>' +
      '</div>' +
    '</div>';
  }

  // ---------- CEO Admin page ----------
  function renderCeoAdminPage() {
    if (!isCeo()) {
      return '<div class="page">' +
        '<button class="back-link" id="backFromCeoAdmin">' + icon("chevronLeft", "var(--navy)", 16) + ' Ak\u00e8y</button>' +
        '<div class="empty-state">Aks\u00e8 refize \u2014 paj sa a rezève pou CEO a sèlman.</div>' +
      '</div>';
    }
    return '<div class="page">' +
      '<button class="back-link" id="backFromCeoAdmin">' + icon("chevronLeft", "var(--navy)", 16) + ' Ak\u00e8y</button>' +
      '<div class="page-title">CEO Admin</div>' +
      '<div class="stats-row" style="padding:0;margin-bottom:16px;">' +
        '<div class="stat-card"><div class="stat-value">' + piecesCount + '</div><div class="stat-label">Py\u00e8s nan Baz Done</div></div>' +
      '</div>' +
      '<div class="section-title" style="padding:0;">Zouti Administrasyon</div>' +
      '<div class="cards-grid">' +
        '<div class="info-card"><h4>Jere Piblikasyon yo</h4><ul><li>Wè, apwouve, oswa retire py\u00e8s ki pibliye yo.</li></ul></div>' +
        '<div class="info-card"><h4>Jere Itilizat\u00e8 yo</h4><ul><li>Wè lis kont yo, bloke fo kont.</li></ul></div>' +
        '<div class="info-card"><h4>Estatistik Sist\u00e8m</h4><ul><li>Swiv itilizasyon platf\u00f2m lan an tan reyèl.</li></ul></div>' +
      '</div>' +
      '<p style="font-size:12px;color:var(--text-gray);margin-top:14px;">Zouti sa yo se yon w\u00e8frame depa \u2014 nou ka bati chak fonksyon an detay pita.</p>' +
    '</div>';
  }

  // ---------- Onboarding (reused) ----------
  function renderHeader(header) {
    let inner = "";
    if (header.type === "logo") inner += '<img class="logo-img" src="' + LOGO_SRC + '" alt="Logo SekouPy\u00e8s" />';
    else if (header.type === "icon" && header.icon) inner += '<div class="icon-box">' + icon(header.icon, "var(--gold)") + '</div>';
    if (header.title) inner += '<h2 class="header-title">' + header.title + '</h2>';
    if (header.subtitle) inner += '<p class="header-subtitle">' + header.subtitle + '</p>';
    if (header.badge) inner += '<div class="badge">' + icon(header.badgeIcon || "zap", "var(--gold-light)") + '<span>' + header.badge + '</span></div>';
    return '<div class="card-header">' + inner + '</div>';
  }

  function renderBody(body) {
    let inner = "";
    if (body.title) inner += '<h2 class="body-title">' + body.title + '</h2>';
    if (body.description) inner += '<p class="body-description">' + body.description + '</p>';
    if (body.intro) inner += '<p class="body-intro">' + body.intro + '</p>';
    if (body.options) {
      inner += '<ul class="options-list">';
      body.options.forEach(function (opt) { inner += '<li><span class="opt-label">' + opt.label + '</span> ' + opt.text + '</li>'; });
      inner += '</ul>';
    }
    if (body.steps) {
      inner += '<ul class="steps-list">';
      body.steps.forEach(function (s) { inner += '<li>' + s + '</li>'; });
      inner += '</ul>';
    }
    if (body.cards) {
      inner += '<div class="cards-grid">';
      body.cards.forEach(function (c) {
        inner += '<div class="info-card"><h4>' + c.title + '</h4><ul>';
        c.items.forEach(function (it) { inner += '<li>' + it + '</li>'; });
        inner += '</ul></div>';
      });
      inner += '</div>';
    }
    if (body.disclaimer) inner += '<div class="disclaimer-box">' + icon("info", "var(--gold-light)") + ' &nbsp;' + body.disclaimer + '</div>';
    return inner;
  }

  function renderOnboarding() {
    const slide = SLIDES[step];
    const isFirst = step === 0;
    const isLast = step === SLIDES.length - 1;
    let dots = "";
    SLIDES.forEach(function (_, i) { dots += '<div class="dot' + (i === step ? ' active' : '') + '"></div>'; });
    let buttons = '<div class="btn-row">';
    if (!isFirst) buttons += '<button class="btn btn-back" id="btnBack">' + icon("chevronLeft", "var(--navy)") + ' Retou</button>';
    buttons += '<button class="btn btn-primary ' + (isFirst ? "gold" : "navy") + '" id="btnNext">' +
      (isLast ? "K\u00f2manse!" : "Swivan") +
      (isLast ? "" : icon("chevronRight", isFirst ? "var(--navy)" : "var(--paper)")) +
      '</button>';
    buttons += '</div>';
    return '<div class="overlay"><div class="card">' +
      '<button class="close-btn" id="btnClose">' + ICONS.x + '</button>' +
      renderHeader(slide.header) +
      '<div class="card-body">' + renderBody(slide.body) +
      '<div class="dots">' + dots + '</div>' +
      buttons +
      '<button class="skip-link" id="btnSkip">Pase \u2014 sote gid la</button>' +
      '</div></div></div>';
  }

  // ---------- Bottom nav + chat ----------
  function renderBottomNav() {
    function item(key, label, iconName) {
      const isActive = activeNav === key;
      return '<button class="nav-item' + (isActive ? ' active' : '') + '" data-nav="' + key + '">' +
        icon(iconName, isActive ? "var(--navy)" : "var(--text-gray)", 20) +
        '<span>' + label + '</span></button>';
    }
    return '<div class="bottom-nav">' + item("home", "Ak\u00e8y", "home") + item("scan", "Skane", "scan") + item("account", "Kont Mwen", "user") + '</div>';
  }

  function renderChat() {
    return '<div class="chat-panel' + (chatOpen ? ' open' : '') + '" id="chatPanel">' +
      '<div class="chat-header"><span>Chat Sip\u00f2 SekouPy\u00e8s</span><button id="chatCloseBtn">' + ICONS.x + '</button></div>' +
      '<div class="chat-body">Bonjou! Kijan m ka ede w jodi a?</div>' +
      '<div class="chat-input-row"><input type="text" id="chatInputField" placeholder="Ekri mesaj ou..." />' +
      '<button id="chatSendBtn">' + icon("chevronRight", "#fff", 16) + '</button></div>' +
    '</div>';
  }

  // ---------- Main render ----------
  function render() {
    const app = document.getElementById("app");
    let pageHtml = "";
    if (currentView === "home") pageHtml = renderHome();
    else if (currentView === "search") pageHtml = '<div class="home"><div class="home-inner">' + renderSearchPage() + '</div></div>';
    else if (currentView === "publish") pageHtml = '<div class="home"><div class="home-inner">' + renderPublishPage() + '</div></div>';
    else if (currentView === "account") pageHtml = '<div class="home"><div class="home-inner">' + renderAccountPage() + '</div></div>';
    else if (currentView === "security") pageHtml = '<div class="home"><div class="home-inner">' + renderSecurityPage() + '</div></div>';
    else if (currentView === "ceoAdmin") pageHtml = '<div class="home"><div class="home-inner">' + renderCeoAdminPage() + '</div></div>';

    let html = renderTopNavbar() + renderSidebar() + pageHtml + renderBottomNav() +
      '<button class="chat-fab" id="btnChat">' + ICONS.chat + '</button>' + renderChat();

    if (onboardingVisible) html += renderOnboarding();
    // reopen-btn demo retire pou pwodiksyon
    html += renderForgotModal();

    app.innerHTML = html;
    attachEvents();
  }

  function goto(view, navKey) {
    currentView = view;
    if (navKey) activeNav = navKey;
    sidebarOpen = false;
    render();
    window.scrollTo(0, 0);
  }

  function attachEvents() {
    const q = function (id) { return document.getElementById(id); };

    // Onboarding
    const btnNext = q("btnNext"), btnBack = q("btnBack"), btnSkip = q("btnSkip"), btnClose = q("btnClose"), btnReopen = q("btnReopen");
    if (btnNext) btnNext.addEventListener("click", function () {
      if (step === SLIDES.length - 1) onboardingVisible = false;
      else step = Math.min(step + 1, SLIDES.length - 1);
      render();
    });
    if (btnBack) btnBack.addEventListener("click", function () { step = Math.max(step - 1, 0); render(); });
    if (btnSkip) btnSkip.addEventListener("click", function () { onboardingVisible = false; render(); });
    if (btnClose) btnClose.addEventListener("click", function () { onboardingVisible = false; render(); });
    if (btnReopen) btnReopen.addEventListener("click", function () { step = 0; onboardingVisible = true; render(); });

    // Bottom nav
    document.querySelectorAll(".nav-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const key = btn.getAttribute("data-nav");
        if (key === "home") goto("home", "home");
        else if (key === "scan") goto("publish", "scan");
        else if (key === "account") goto("account", "account");
      });
    });

    // Sidebar
    const btnMenu = q("btnMenu"), sidebarClose = q("sidebarClose"), sidebarOverlay = q("sidebarOverlay");
    if (btnMenu) btnMenu.addEventListener("click", function () { sidebarOpen = true; render(); });
    if (sidebarClose) sidebarClose.addEventListener("click", function () { sidebarOpen = false; render(); });
    if (sidebarOverlay) sidebarOverlay.addEventListener("click", function () { sidebarOpen = false; render(); });
    document.querySelectorAll(".sidebar-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const dest = btn.getAttribute("data-goto");
        if (!dest) return;
        goto(dest, dest === "publish" ? "scan" : dest);
      });
    });
    const sidebarSupport = q("sidebarSupport"), sidebarAuthBtn = q("sidebarAuthBtn");
    if (sidebarSupport) sidebarSupport.addEventListener("click", function () {
      window.open("https://wa.me/50940997686", "_blank");
    });
    if (sidebarAuthBtn) sidebarAuthBtn.addEventListener("click", function () {
      if (session) { handleSignOut(); }
      else { goto("account", "account"); }
    });

    // Connect / profile
    const btnConnect = q("btnConnect"), btnProfile = q("btnProfile");
    if (btnConnect) btnConnect.addEventListener("click", function () { goto("account", "account"); });
    if (btnProfile) btnProfile.addEventListener("click", function () { goto("account", "account"); });

    // Home CTAs
    const ctaLost = q("ctaLost"), ctaFound = q("ctaFound");
    if (ctaLost) ctaLost.addEventListener("click", function () { goto("search", "scan"); });
    if (ctaFound) ctaFound.addEventListener("click", function () { goto("publish", "scan"); });

    // Doc category badges -> search with filter
    document.querySelectorAll(".doc-badge").forEach(function (b) {
      b.addEventListener("click", function () {
        searchCategoryFilter = b.getAttribute("data-cat");
        goto("search", "scan");
        runSearch(searchQuery, searchCategoryFilter);
      });
    });

    // How it works accordion
    const howItWorksToggle = q("howItWorksToggle"), howItWorksClose = q("howItWorksClose");
    if (howItWorksToggle) howItWorksToggle.addEventListener("click", function () { howItWorksOpen = !howItWorksOpen; render(); });
    if (howItWorksClose) howItWorksClose.addEventListener("click", function () { howItWorksOpen = false; render(); });

    // See more / publish first link -> search
    const seeMoreNote = q("seeMoreNote"), publishFirstLink = q("publishFirstLink");
    if (seeMoreNote) seeMoreNote.addEventListener("click", function () { goto("search", "scan"); setTimeout(function () { const el = q("searchInput"); if (el) el.focus(); }, 50); });
    if (publishFirstLink) publishFirstLink.addEventListener("click", function (e) { e.preventDefault(); goto("publish", "scan"); });

    // Share buttons
    const shareText = "Mwen jwenn oswa pataje platf\u00f2m SekouPy\u00e8s pou ede retounen py\u00e8s idantite ki p\u00e8di an Ayiti: " + window.location.href;
    const shareWa = q("shareWa"), shareFb = q("shareFb"), shareX = q("shareX"), shareIg = q("shareIg");
    if (shareWa) shareWa.addEventListener("click", function (e) {
      e.preventDefault();
      window.open("https://wa.me/?text=" + encodeURIComponent(shareText), "_blank");
    });
    if (shareFb) shareFb.addEventListener("click", function (e) {
      e.preventDefault();
      window.open("https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(window.location.href), "_blank");
    });
    if (shareX) shareX.addEventListener("click", function (e) {
      e.preventDefault();
      window.open("https://twitter.com/intent/tweet?text=" + encodeURIComponent(shareText), "_blank");
    });
    if (shareIg) shareIg.addEventListener("click", function (e) {
      e.preventDefault();
      window.open("https://www.instagram.com/", "_blank");
    });

    // Copy UID
    const copyUidBtn = q("copyUidBtn");
    if (copyUidBtn) copyUidBtn.addEventListener("click", function () {
      const uid = visitorId();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(uid).then(function () { showToast("ID kopye!"); });
      } else {
        showToast("Pa ka kopye otomatikman sou navigat\u00e8 sa a.");
      }
    });

    // Search page
    const searchInput = q("searchInput"), searchSubmitBtn = q("searchSubmitBtn"), backFromSearch = q("backFromSearch");
    if (searchInput) searchInput.addEventListener("input", function () { searchQuery = searchInput.value; });
    if (searchSubmitBtn) searchSubmitBtn.addEventListener("click", function () { runSearch(searchQuery, searchCategoryFilter); });
    if (backFromSearch) backFromSearch.addEventListener("click", function () { goto("home", "home"); });
    document.querySelectorAll(".chip").forEach(function (c) {
      if (!c.hasAttribute("data-chip")) return;
      c.addEventListener("click", function () {
        const cat = c.getAttribute("data-chip");
        searchCategoryFilter = (searchCategoryFilter === cat) ? null : cat;
        render();
      });
    });

    // Publish page
    const backFromPublish = q("backFromPublish"), pubSubmitBtn = q("pubSubmitBtn");
    document.querySelectorAll("[data-pubchip]").forEach(function (c) {
      c.addEventListener("click", function () {
        const cat = c.getAttribute("data-pubchip");
        searchCategoryFilter = (searchCategoryFilter === cat) ? null : cat;
        render();
      });
    });
    if (backFromPublish) backFromPublish.addEventListener("click", function () { goto("home", "home"); });
    if (pubSubmitBtn) pubSubmitBtn.addEventListener("click", async function () {
      const name = (q("pubName") || {}).value || "";
      const desc = (q("pubDesc") || {}).value || "";
      const contact = (q("pubContact") || {}).value || "";
      if (!searchCategoryFilter || !name) { alert("Tanpri chwazi yon kalite py\u00e8s epi antre non an."); return; }
      const ok = await publishPiece({ category: searchCategoryFilter, full_name: name, description: desc, contact: contact, status: "jwenn" });
      if (ok) { alert("Py\u00e8s la pibliye avèk siks\u00e8!"); goto("home", "home"); }
    });

    // Account / login page
    const backFromAccount = q("backFromAccount"), authSubmitBtn = q("authSubmitBtn"), googleAuthBtn = q("googleAuthBtn"), toggleAuthMode = q("toggleAuthMode"), signOutBtn = q("signOutBtn");
    const authEmailInput = q("authEmail"), authPasswordInput = q("authPassword");
    if (authEmailInput) authEmailInput.addEventListener("input", function () { authEmail = authEmailInput.value; });
    if (authPasswordInput) authPasswordInput.addEventListener("input", function () { authPassword = authPasswordInput.value; });
    if (backFromAccount) backFromAccount.addEventListener("click", function () { goto("home", "home"); });
    const backFromSecurity = q("backFromSecurity"), backFromCeoAdmin = q("backFromCeoAdmin");
    if (backFromSecurity) backFromSecurity.addEventListener("click", function () { goto("home", "home"); });
    if (backFromCeoAdmin) backFromCeoAdmin.addEventListener("click", function () { goto("home", "home"); });
    if (authSubmitBtn) authSubmitBtn.addEventListener("click", function () {
      if (authMode === "signup") handleSignUp(); else handleSignIn();
    });
    if (googleAuthBtn) googleAuthBtn.addEventListener("click", handleGoogleAuth);
    if (toggleAuthMode) toggleAuthMode.addEventListener("click", function () {
      authMode = authMode === "signup" ? "signin" : "signup";
      authError = ""; authSuccess = "";
      render();
    });
    if (signOutBtn) signOutBtn.addEventListener("click", handleSignOut);

    // Sign-in password eye toggle + remember me
    const toggleSigninPw = q("toggleSigninPw"), rememberMeCheck = q("rememberMeCheck"), forgotPasswordLink = q("forgotPasswordLink");
    if (toggleSigninPw) toggleSigninPw.addEventListener("click", function () { showPassword = !showPassword; render(); });
    if (rememberMeCheck) rememberMeCheck.addEventListener("change", function () { rememberMe = rememberMeCheck.checked; });
    if (forgotPasswordLink) forgotPasswordLink.addEventListener("click", openForgotPassword);

    // Sign-up fields
    const signupFullNameInput = q("signupFullName"), sexGason = q("sexGason"), sexFi = q("sexFi");
    const signupConfirmPasswordInput = q("signupConfirmPassword"), signupPhoneInput = q("signupPhone");
    const toggleSignupPw = q("toggleSignupPw"), toggleSignupConfirmPw = q("toggleSignupConfirmPw");
    if (signupFullNameInput) signupFullNameInput.addEventListener("input", function () { signupFullName = signupFullNameInput.value; });
    if (sexGason) sexGason.addEventListener("change", function () { signupSex = "Gason"; });
    if (sexFi) sexFi.addEventListener("change", function () { signupSex = "Fi"; });
    if (signupConfirmPasswordInput) signupConfirmPasswordInput.addEventListener("input", function () { signupConfirmPassword = signupConfirmPasswordInput.value; });
    if (signupPhoneInput) signupPhoneInput.addEventListener("input", function () { signupPhone = signupPhoneInput.value; });
    if (toggleSignupPw) toggleSignupPw.addEventListener("click", function () { showSignupPassword = !showSignupPassword; render(); });
    if (toggleSignupConfirmPw) toggleSignupConfirmPw.addEventListener("click", function () { showSignupConfirmPassword = !showSignupConfirmPassword; render(); });

    // Forgot password modal
    const forgotModalOverlay = q("forgotModalOverlay"), forgotCancelBtn = q("forgotCancelBtn");
    const forgotEmailInput = q("forgotEmailInput"), forgotOtpInput = q("forgotOtpInput");
    const forgotNewPwInput = q("forgotNewPwInput"), forgotConfirmPwInput = q("forgotConfirmPwInput");
    const forgotSubmitEmailBtn = q("forgotSubmitEmailBtn"), forgotSubmitOtpBtn = q("forgotSubmitOtpBtn"), forgotSubmitNewPwBtn = q("forgotSubmitNewPwBtn");
    if (forgotCancelBtn) forgotCancelBtn.addEventListener("click", closeForgotPassword);
    if (forgotEmailInput) forgotEmailInput.addEventListener("input", function () { forgotEmail = forgotEmailInput.value; });
    if (forgotOtpInput) forgotOtpInput.addEventListener("input", function () { forgotOtp = forgotOtpInput.value; });
    if (forgotNewPwInput) forgotNewPwInput.addEventListener("input", function () { forgotNewPassword = forgotNewPwInput.value; });
    if (forgotConfirmPwInput) forgotConfirmPwInput.addEventListener("input", function () { forgotConfirmPassword = forgotConfirmPwInput.value; });
    if (forgotSubmitEmailBtn) forgotSubmitEmailBtn.addEventListener("click", submitForgotEmail);
    if (forgotSubmitOtpBtn) forgotSubmitOtpBtn.addEventListener("click", submitForgotOtp);
    if (forgotSubmitNewPwBtn) forgotSubmitNewPwBtn.addEventListener("click", submitNewPassword);


    // Chat (keyboard should NOT auto-open — no .focus() call here)
    const btnChat = q("btnChat"), chatCloseBtn = q("chatCloseBtn"), chatSendBtn = q("chatSendBtn");
    if (btnChat) btnChat.addEventListener("click", function () { chatOpen = !chatOpen; render(); });
    if (chatCloseBtn) chatCloseBtn.addEventListener("click", function () { chatOpen = false; render(); });
    if (chatSendBtn) chatSendBtn.addEventListener("click", function () {
      const inp = q("chatInputField");
      if (inp && inp.value.trim()) { inp.value = ""; }
    });
  }

  refreshPieces();
  render();
})();
</script>
</body>
