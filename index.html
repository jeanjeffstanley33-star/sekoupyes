    const scrollSnapshots = [];
    document.querySelectorAll(".ceo-tabs-row, [data-preserve-scroll]").forEach(function (el, i) {
      el.setAttribute("data-scroll-idx", String(i));
      scrollSnapshots[i] = el.scrollLeft;
    });

    // ---- MIZAJOU AN SILANS (silent, sans flach) ----
    // Olye retire TOUT DOM la epi rekreye l nèt (sa te lakòz klavye fèmen,
    // paj sote, ak yon ti "flach" vizyèl chak fwa yon mizajou background
    // rive), nou kounye a itilize "morphdom" — li konpare NOUVO HTML la ak
    // sa ki deja afiche a, epi li modifye SÈLMAN sa ki reyèlman chanje,
    // pyès pa pyès. Eleman ki pa chanje pa menm touche — kidonk fok\u00f2s,
    // pozisyon kizè, ak defilman rete egzakteman kote yo te ye a.
    if (window.morphdom) {
      morphdom(app, '<div id="app">' + html + '</div>', {
        onBeforeElUpdated: function (fromEl, toEl) {
          // Si se egzakteman chan ki gen fok\u00f2s kounye a (moun nan ap tape
          // ladan l), pa kite morphdom touche valè/kizè li menm si tèks
          // anviwon l chanje — sa a se sa ki anpeche klavye a "sote".
          if (fromEl === document.activeElement && (fromEl.tagName === "INPUT" || fromEl.tagName === "TEXTAREA")) {
            toEl.value = fromEl.value;
          }
          // JANM touche yon <canvas> ki deja gen kontni desine sou li
          // (egzanp: zouti "Kache Nimewo"/rekadraj la). Chanje LARJÈ/WOT\u00c8
          // yon canvas EFASE tout desen ki te sou li a — se poutèt sa
          // "morphdom" pa dwe janm re-patch li si li deja aktif.
          if (fromEl.tagName === "CANVAS" && fromEl.width > 0) {
            return false;
          }
          // JANM touche yon <input type="file"> — navigat\u00e8 yo pa menm
          // pèmèt JS chanje valè li pou rezon sekirite, epi eseye fè sa
          // ka kreye erè oswa konpòtman etranj san rezon.
          if (fromEl.tagName === "INPUT" && fromEl.type === "file") {
            return false;
          }
          return true;
        },
      });
    } else {
      // Filè sekirite: si morphdom pa t chaje (CDN echwe), rekonstriksyon
      // klasik la toujou mache, jis mwens likid.
      app.innerHTML = html;
    }

    document.querySelectorAll(".ceo-tabs-row, [data-preserve-scroll]").forEach(function (el, i) {
      if (scrollSnapshots[i] !== undefined) el.scrollLeft = scrollSnapshots[i];
    });

    attachEvents();
    syncNavHistory();
  }

  // Kounye a ke nou itilize morphdom (mizajou an silans), menm eleman DOM
  // yo ka SIVIV plizyè render() youn apre lòt (yo pa detwi/rekreye ankò).
  // San pwoteksyon, chak render() ta rekole yon NOUVO "listener" sou menm
  // bouton an, epi yon sèl klik ta fè aksyon an fèt PLIZYÈ FWA. Fonksyon
  // "on()" sa a make chak eleman apre li fin gen yon "listener" pou yon
  // evènman done, epi li REFIZE tache yon dezyèm fwa pou menm evènman an.
  function on(el, eventType, handler, opts) {
    if (!el) return;
    const key = "__wired_" + eventType;
    if (el[key]) return;
    el[key] = true;
    el.addEventListener(eventType, handler, opts);
  }

  function attachEvents() {

      if (redactorZoomInBtn) on(redactorZoomInBtn, "click", redactorZoomIn);

      if (redactorRotateBtn) on(redactorRotateBtn, "click", redactorRotate);

      if (redactorUndoBtn) on(redactorUndoBtn, "click", undoRedactor);
      if (redactorSaveBtn) on(redactorSaveBtn, "click", saveRedactorResult);
      const redactorModeBlurBtn = q("redactorModeBlurBtn"), redactorModeCropBtn = q("redactorModeCropBtn"), redactorApplyCropBtn = q("redactorApplyCropBtn");
      if (redactorModeBlurBtn) on(redactorModeBlurBtn, "click", function () { setRedactorMode("blur"); });
      if (redactorModeCropBtn) on(redactorModeCropBtn, "click", function () { setRedactorMode("crop"); });

    }
    if (lightboxDownloadBtn) on(lightboxDownloadBtn, "click", downloadLightboxImage);

    if (lightboxOpen && lightboxImgWrap) {
      const lbImg = q("lightboxImg");
      let pinchStartDist = 0, pinchStartScale = 1;
      let panStartX = 0, panStartY = 0, panOriginX = 0, panOriginY = 0;
      let isPanning = false;
      let lastTapTime = 0;

      function dist(t1, t2) {
        return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      }

      on(lightboxImgWrap, "touchstart", function (e) {
        if (e.touches.length === 2) {
          pinchStartDist = dist(e.touches[0], e.touches[1]);
          pinchStartScale = lightboxScale;
        } else if (e.touches.length === 1) {
          const now = Date.now();
          if (now - lastTapTime < 300) {
            // Doub tap — zoom rapid
            lightboxScale = lightboxScale > 1 ? 1 : 2.5;
            lightboxPanX = 0; lightboxPanY = 0;
            applyLightboxTransform();
          }
          lastTapTime = now;
          if (lightboxScale > 1) {
            isPanning = true;
            panStartX = e.touches[0].clientX; panStartY = e.touches[0].clientY;
            panOriginX = lightboxPanX; panOriginY = lightboxPanY;
          }
        }
      }, { passive: true });

      on(lightboxImgWrap, "touchmove", function (e) {
        if (e.touches.length === 2 && pinchStartDist > 0) {
          const newDist = dist(e.touches[0], e.touches[1]);
          lightboxScale = Math.min(4, Math.max(1, pinchStartScale * (newDist / pinchStartDist)));
          if (lbImg) lbImg.style.transform = "translate(" + lightboxPanX + "px, " + lightboxPanY + "px) scale(" + lightboxScale + ")";
        } else if (e.touches.length === 1 && isPanning && lightboxScale > 1) {
          lightboxPanX = panOriginX + (e.touches[0].clientX - panStartX);
          lightboxPanY = panOriginY + (e.touches[0].clientY - panStartY);
          if (lbImg) lbImg.style.transform = "translate(" + lightboxPanX + "px, " + lightboxPanY + "px) scale(" + lightboxScale + ")";
        }
      }, { passive: true });

      on(lightboxImgWrap, "touchend", function (e) {
        if (e.touches.length === 0) {
          isPanning = false; pinchStartDist = 0;
          if (lightboxScale <= 1) { lightboxScale = 1; lightboxPanX = 0; lightboxPanY = 0; applyLightboxTransform(); }
        }
      }, { passive: true });

      // Souri (dèsktòp) — doub-klike pou zoom
      if (lbImg) on(lbImg, "dblclick", function () {
        lightboxScale = lightboxScale > 1 ? 1 : 2.5;
        lightboxPanX = 0; lightboxPanY = 0;
        applyLightboxTransform();
      });

  let lastNavSignature = null;
  let isRestoringFromPopstate = false;

  function currentNavSignature() {
    return currentView + "|" + (cameraModalOpen ? "1" : "0") + "|" + (lightboxOpen ? "1" : "0");
  }

  function syncNavHistory() {
    if (!authInitialized) return;
    const sig = currentNavSignature();
    if (isRestoringFromPopstate) {
      lastNavSignature = sig;
      isRestoringFromPopstate = false;
      return;
    }
    if (lastNavSignature !== null && sig !== lastNavSignature) {
      try {
        history.pushState(
          { sekoupyesNav: true, view: currentView, cam: cameraModalOpen, lb: lightboxOpen },
          "", location.href
        );
      } catch (e) { /* pa gen pwoblèm */ }
    }
    lastNavSignature = sig;
  }

      isRestoringFromPopstate = true;
      currentView = e.state.view || "home";
      cameraModalOpen = !!e.state.cam;
      lightboxOpen = !!e.state.lb;
      if (!lightboxOpen) lightboxImageUrl = "";
      render();
    }
    // Si pa gen state sekoupyesNav (rive nan rasin nan, deja sou Ak\u00e8y san
    // anyen louvri), nou pa fè anyen — navigat\u00e8 a kite moun nan soti nòmalman.
  });

  // ---------- Aksyon an Dir\u00e8k (Realtime) pou py\u00e8s ak notifikasyon ----------
  // N.B: "try/catch" pa ka kenbe erè abònman Realtime yo, paske .subscribe()
  // se yon operasyon ASENKRÒN (websocket) — yon erè pandan koneksyon an pa
  // "jete" (throw) menm kote a, kidonk try/catch pa janm wè l. Nou kounye a
  // itilize vrè callback estati Realtime a bay, EPI nou ajoute yon deziyèm
  // sistèm sekirite: yon "pulse" ki rafrechi done yo chak 15 segond kanmenm,
  // pou aplikasyon an TOUJOU mete ekran an ajou menm si Realtime echwe pou
  // nenpòt rezon (RLS, rezo, konfigirasyon Supabase, elatriye).
  function subscribeRealtimeChannel(channelName, table, eventType, onChange) {
    try {
      supabaseClient
        .channel(channelName)
        .on("postgres_changes", { event: eventType, schema: "public", table: table }, onChange)
        .subscribe(function (status) {
          if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
            // Realtime pa disponib pou kanal sa a — "pulse" a ba a ap toujou
            // kenbe done yo ajou kanmenm, kidonk pa gen okenn blokaj pou moun nan.
          }
        });
    } catch (e) { /* menm bagay — "pulse" la kouvri sa */ }
  }

  subscribeRealtimeChannel("pieces_live_channel", "pieces", "*", function () {
    refreshPieces();
    if (currentView === "search") {
      if (searchHasSearched) runSearch(searchQuery, searchCategoryFilter, true);
      else loadSearchRecent(true);
    }
    if (currentView === "ceoAdmin" && isCeo()) {
      if (ceoAdminActiveTab === "moderation" && !isCeoActivelyEditingPhoto()) loadCeoModeration(true);
      if (ceoAdminActiveTab === "pieces") loadCeoAdminPieces(true);
      if (ceoAdminActiveTab === "overview") loadCeoAdminOverview();
      if (ceoAdminActiveTab === "alerts") loadCeoAllAlerts(true);
    }
  });

  subscribeRealtimeChannel("announcements_live_channel", "announcements", "INSERT", function () {
    loadPublicAnnouncements(false);
  });

  subscribeRealtimeChannel("payments_live_channel", "payment_requests", "*", function () {
    if (currentView === "ceoAdmin" && isCeo()) {
      if (ceoAdminActiveTab === "payments") loadCeoAdminPayments(true);
      if (ceoAdminActiveTab === "overview") loadCeoAdminOverview();
      if (ceoAdminActiveTab === "finance") loadCeoFinance(true);
    }
    loadMyUnlockedPieces();
  });

  subscribeRealtimeChannel("alerts_live_channel", "alerts", "*", function () {
    if (currentView === "ceoAdmin" && isCeo() && ceoAdminActiveTab === "alerts") loadCeoAllAlerts(true);
    if (currentView === "ceoAdmin" && isCeo() && ceoAdminActiveTab === "overview") loadCeoAdminOverview();
  });

  // "Pulse" sekirite — garanti done yo rete ajou menm si Realtime pa reponn.
  // Entèval 5 segonn: sa nòmal e san danje paske TOUT mizajou yo fèt an
  // silans (silent=true) — pa gen "chaje..." ki parèt, DOM la modifye
  // an silans pa morphdom, jodi a klavye/kizè/defilman pa janm deranje.
  setInterval(function () {
    if (!authInitialized) return;
    refreshPieces();
    if (currentView === "search") {
      if (searchHasSearched) runSearch(searchQuery, searchCategoryFilter, true);
      else loadSearchRecent(true);
    }
    loadPublicAnnouncements(false);
    loadMyUnlockedPieces();
    if (currentView === "ceoAdmin" && isCeo()) {
      if (ceoAdminActiveTab === "moderation" && !isCeoActivelyEditingPhoto()) loadCeoModeration(true);
      if (ceoAdminActiveTab === "payments") loadCeoAdminPayments(true);
      if (ceoAdminActiveTab === "alerts") loadCeoAllAlerts(true);
      if (ceoAdminActiveTab === "overview") loadCeoAdminOverview();
    }
  }, 5000);

  render();
})();
</script>
</body>
</html>
